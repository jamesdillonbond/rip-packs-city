# Dependabot — security-only auto-PRs.
#
# Rationale: CLAUDE.md enforces direct-to-main / no PRs for human work, but
# CVEs are the exception worth carving out. This keeps elliptic, next, react,
# and the rest patched without manual tracking. Only `security-updates` is
# enabled — Dependabot will NOT open PRs for routine version bumps.
#
# Audit reference: AUDIT_2026-05-18.md §5 item 13.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Security-only — no routine version bumps
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "deps(sec)"
      include: "scope"
    labels:
      - "security"
      - "dependabot"
    # GitHub Actions workflows in .github/workflows/ also get monitored
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(sec)"
    labels:
      - "security"
      - "ci"
