# Dependabot — security-only auto-PRs.
#
# Rationale: CLAUDE.md enforces direct-to-main / no PRs for human work, but
# CVEs are the exception worth carving out. This keeps elliptic, next, react,
# and the rest patched without manual tracking.
#
# 2026-05-30: tightened to genuinely be security-only. The previous
# `allow: dependency-type: "all"` block was a no-op (matched the default) and
# Dependabot was opening routine version-bump PRs (debug, eslint-visit-keys,
# uuid, actions/setup-node, actions/checkout) that the no-PR rule says we
# shouldn't have. Adding the wildcard `ignore` block tells Dependabot to skip
# every routine semver bump for every dependency. Security advisories bypass
# `ignore` automatically, so CVEs still surface as PRs.
#
# Audit reference: AUDIT_2026-05-18.md §5 item 13.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    # Security-only enforcement — block routine semver bumps for every package.
    # Security advisories ignore this rule and still open PRs.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(sec)"
      include: "scope"
    labels:
      - "security"
      - "dependabot"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
    commit-message:
      prefix: "ci(sec)"
    labels:
      - "security"
      - "ci"
