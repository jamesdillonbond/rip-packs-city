name: Edge function deploy (from the committed files)

# 2026-09-25. Deploys ONE Supabase edge function from the files committed on
# the ref this workflow runs on, with the Supabase CLI — a path that UPLOADS
# FILES. Every deploy before this went through the MCP `deploy_edge_function`
# verb, which takes each file's content as an inline JSON argument, so a large
# function had to be hand-transcribed by an agent: the MCP decoded `\uXXXX`
# escapes in transit (sync-nba-projections v52) and `enrich-ufc-wallet` sat
# DEPLOY_DEFERRED for weeks because its 340 lines embed Cadence contract
# addresses that a single wrong hex digit would silently re-point. Here nothing
# is transcribed: the bytes deployed are the bytes in git.
#
# Guards, in order:
#   1. the slug must be a real directory under supabase/functions (not _shared);
#   2. a function whose source reads a `*_GATE_KEY` env var is REFUSED unless
#      `gate_secret_is_set` is ticked — shipping the env-var gate before its
#      secret exists fails CLOSED on every cron tick and writes no pipeline_runs
#      row (the 2026-08-12 and 2026-09-20 outages; rpc-edge-fn-deploy §1);
#   3. `--no-verify-jwt` + `--import-map supabase/functions/deno.json`, both
#      mandatory (no supabase/config.toml, so the CLI would default verify_jwt
#      to TRUE and 401 every caller);
#   4. POST-CONDITIONS, read back from production: verify_jwt is false, and the
#      drift census reads this slug `clean` (deployed body == repo file). A
#      deploy that cannot prove both fails the run.
#
# Credentials: the same SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID repo
# secrets edge-fn-drift.yml already uses. workflow_dispatch only — nothing
# deploys on push.

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function slug (a directory under supabase/functions)"
        required: true
        type: string
      gate_secret_is_set:
        description: "If the function reads a *_GATE_KEY: I confirm that secret is set in Supabase and matches what its cron sends"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: edge-fn-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.function }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      FN: ${{ inputs.function }}
      GATE_OK: ${{ inputs.gate_secret_is_set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Pre-flight
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID are not configured — nothing deployed."
            exit 2
          fi
          if ! printf '%s' "$FN" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || [ "$FN" = "_shared" ]; then
            echo "::error::'$FN' is not a function slug."
            exit 2
          fi
          if [ ! -f "supabase/functions/$FN/index.ts" ]; then
            echo "::error::supabase/functions/$FN/index.ts does not exist on this ref."
            exit 2
          fi
          if grep -Eq '_GATE_KEY' "supabase/functions/$FN/index.ts" && [ "$GATE_OK" != "true" ]; then
            echo "::error::$FN reads a *_GATE_KEY env var. Deploying before that secret is set 403s every cron tick with no pipeline_runs row. Re-run with gate_secret_is_set ticked once it is."
            exit 2
          fi
          echo "deploying $FN from $(git rev-parse --short HEAD)"

      - name: Deploy (CLI, files uploaded as committed)
        run: |
          set -euo pipefail
          npx --yes supabase@2.118.0 functions deploy "$FN" \
            --no-verify-jwt \
            --import-map supabase/functions/deno.json \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Post-condition — verify_jwt is false
        run: |
          set -euo pipefail
          body=$(curl -sS --fail -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/functions/$FN") || body=""
          # `run:` is bash -e: without the `|| body=""` a failed curl aborts HERE and
          # the verify_jwt check below never runs. An empty body is a failed check.
          if [ -z "$body" ]; then
            echo "::error::could not read $FN from the Management API — verify_jwt NOT verified"
            exit 1
          fi
          node -e '
            const f = JSON.parse(process.argv[1]);
            console.log(`${f.slug} v${f.version} verify_jwt=${f.verify_jwt} status=${f.status}`);
            if (f.verify_jwt !== false) { console.error("::error::verify_jwt is not false — every caller will 401"); process.exit(1) }
            if (f.status !== "ACTIVE") { console.error("::error::function is not ACTIVE"); process.exit(1) }
          ' "$body"

      - name: Post-condition — deployed body equals the repo file
        run: |
          set -uo pipefail
          npm ci --silent
          # exit 1 = some OTHER function drifts too; that is not this deploy's
          # verdict. Read this slug's own verdict from the report instead.
          # (`run:` is bash -e: capture the code with `||`, never a bare `rc=$?`.)
          rc=0
          npm run -s edge:drift:check -- --json > /dev/null || rc=$?
          if [ "$rc" -ge 2 ]; then echo "::error::drift census did not run (exit $rc)"; exit 1; fi
          node -e '
            const r = require("./edge-fn-drift-report.json");
            const p = (r.population || []).find((x) => x.slug === process.env.FN);
            if (!p) { console.error(`::error::${process.env.FN} not in the deployed population`); process.exit(1) }
            console.log(`${p.slug} v${p.version}: ${p.verdict} (bodies read ${r.bodies_read}, census ran ${r.tier2_ran})`);
            if (p.verdict !== "clean") { console.error(`::error::${p.slug} reads ${p.verdict}, not clean`); process.exit(1) }
          '
