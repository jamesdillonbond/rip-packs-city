name: Top Shot Offers History Backfill — recover same-tick offers

# One-shot walk (2026-10-10). The live topshot-offers-indexer used to DROP any
# offer created and completed inside one tick, so ~25 % of offer_fill sales since
# 2026-06-03 had no `offers` row. The forward fix shipped the same day; this walk
# recovers the history: /api/admin/backfill-topshot-offers drains behind its own
# event_cursor (topshot_offers_history_backfill) and ENDS at a fixed block, after
# which every call answers done=true. Insert-only — never writes an open row and
# never overwrites one, so a re-run is safe.
#
# Dispatch-only for target=offers: there is nothing to do once that walk is done.
#
# WEEKLY for target=missing_fills (#189, 2026-10-19). Old open bids keep being
# accepted, and ~9 % of new Top Shot offer fills (232 of 2,462 over 10-11 → 10-18)
# arrive with no `offers` row because the bid was created before the live indexer
# saw it. The 10-18 refresh + re-walk recovered 154 of 247 (created anywhere from
# 2025-12-30 to 2026-10-11, so the walk cannot be narrowed); the rest predate the
# 2025-12-29 spork and are out of this walk's reach. pg_cron
# `topshot-missing-fill-snapshot-weekly` (Mondays 14:07 UTC = 7:07 AM PDT) adds the week's new
# unsourced fills to `topshot_offer_fill_missing_offers`; this schedule re-walks
# from the mainnet28 root 16 minutes later. A scheduled run has no inputs, so the
# env below supplies them: missing_fills, start 137390146, 200k blocks, 200 calls.
on:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "offers = same-tick history walk; missing_fills = recover the offers row behind accepted offers that have none"
        type: choice
        options: [offers, missing_fills]
        default: offers
      range:
        description: "max blocks per call (default 150000, cap 200000)"
        type: string
        default: ""
      start_block:
        description: "one-time cursor start override (first call only); missing_fills reads mainnet27 via spork-proxy from 130290659"
        type: string
        default: ""
      max_iters:
        description: "max bounded calls this run (default 150)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: topshot-offers-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Drain loop
        env:
          RANGE: ${{ github.event_name == 'schedule' && '200000' || github.event.inputs.range }}
          START_BLOCK: ${{ github.event_name == 'schedule' && '137390146' || github.event.inputs.start_block }}
          MAX_ITERS: ${{ github.event_name == 'schedule' && '200' || github.event.inputs.max_iters }}
          TARGET: ${{ github.event_name == 'schedule' && 'missing_fills' || github.event.inputs.target }}
          TOKEN: ${{ secrets.INGEST_SECRET_TOKEN }}
        run: |
          BASE="https://www.rippackscity.com/api/admin/backfill-topshot-offers"
          if [ "$TARGET" = "missing_fills" ]; then BASE="https://www.rippackscity.com/api/admin/backfill-topshot-missing-fill-offers"; fi
          if [ -z "$MAX_ITERS" ]; then MAX_ITERS=150; fi
          if [ -z "$RANGE" ]; then RANGE=150000; fi
          OVERALL=0
          TOTAL_INSERTED=0
          for i in $(seq 1 "$MAX_ITERS"); do
            URL="$BASE?range=$RANGE"
            if [ "$i" = "1" ] && [ -n "$START_BLOCK" ]; then URL="$URL&start_block=$START_BLOCK"; fi
            echo "── call $i/$MAX_ITERS  url=$URL"
            STATUS=$(curl -s -o /tmp/bf.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" \
              --max-time 290 \
              "$URL") || STATUS=""
            echo "HTTP $STATUS"
            cat /tmp/bf.json 2>/dev/null || echo "<no body>"; echo ""
            if [ "$STATUS" != "200" ]; then
              echo "::warning::call $i returned HTTP '$STATUS'"
              OVERALL=1
              break
            fi
            # Every `run:` is bash -e: a fallible assignment must carry its own
            # fallback, then be checked explicitly (never `|| X="0"`).
            OK=$(jq -r '.ok // false' /tmp/bf.json 2>/dev/null) || OK=""
            DONE=$(jq -r '.done // false' /tmp/bf.json 2>/dev/null) || DONE=""
            CB=$(jq -r '.cursor_before // empty' /tmp/bf.json 2>/dev/null) || CB=""
            CA=$(jq -r '.cursor_after // empty' /tmp/bf.json 2>/dev/null) || CA=""
            INS=$(jq -r '.inserted // 0' /tmp/bf.json 2>/dev/null) || INS=""
            if [ -z "$OK" ] && [ -z "$DONE" ]; then
              echo "::warning::call $i: HTTP 200 with a body jq could not parse"
              OVERALL=1
              break
            fi
            if [ "$OK" != "true" ]; then
              echo "::warning::call $i logged ok=$OK"
              OVERALL=1
              break
            fi
            if [ -n "$INS" ]; then TOTAL_INSERTED=$((TOTAL_INSERTED + INS)); fi
            if [ "$DONE" = "true" ]; then echo "walk complete (done=true)"; break; fi
            if [ -n "$CB" ] && [ "$CB" = "$CA" ]; then echo "no cursor progress ($CB) — stopping"; OVERALL=1; break; fi
            sleep 2
          done
          echo "inserted this run: $TOTAL_INSERTED"
          exit $OVERALL
