name: Dead Lane Backstop

# WHY THIS EXISTS (2026-09-10, register #76).
# ------------------------------------------------------------------------
# The Vercel project was paused ~14:00Z on 2026-09-10 and serving was restored
# between 21:46Z and 00:01Z. Every lane on a 4-hourly or 6-hourly cadence came
# back on its FIRST slot after recovery — candy-sales 00:20Z, candy-listings
# 00:35Z, candy-offers 00:50Z, 3 of 3. **Not one lane on a 1-15 minute cadence
# came back at all**, 649-682 minutes silent and counting, with 3 to 50 of their
# own slots passed since the site returned.
#
# ⭐ THE SPLIT IS ALONG CADENCE, AND THAT IS THE TELL. These lanes have no
# scheduler but cron-job.org — their own route headers say so
# (`alerts-send` line 12: "Cron-job.org: every ~5 min"; `alerts-dispatch` line 8:
# "Cron-job.org: every ~15 min"). cron-job.org auto-disables a job after a run of
# consecutive failures, so across a ~10-hour outage a 4-hourly job banked 2-3
# failures and survived while a 1-minute job banked ~640 and did not.
#
# 🚨 THIS REPO HAS ALREADY BEEN BITTEN BY EXACTLY THIS. sales-indexers-backstop.yml's
# own header: "cron-job.org auto-disables a job that persistently fails its 30s
# client cap, so a single bad window can silently kill sales ingest (the
# 2026-05-31 topshot-sales-indexer 01:32-08:02 UTC outage)." The four sales lanes
# got a backstop then. **These ten never did, and that is the whole difference
# between a lane that recovered by itself and a lane still dead 11 hours later.**
#
# ⚠ WHAT THIS IS AND IS NOT. It is a FLOOR, not a restoration. GitHub
# deprioritises `schedule` and drops most of it — measured on this repo
# 2026-08-27, 16 of 48 scheduled runs delivered (one third), max gap 191.9m. So a
# lane whose primary is a 5-minute cron gets, from here, something closer to
# 45-minute cover. ⛔ Do NOT "fix" that by tightening the cron: GitHub drops the
# extra fires too, and sales-indexers-backstop.yml records that lesson already.
# **The real fix is re-enabling the cron-job.org entries, which is an operator
# action.** This exists so that the next time they die, the lanes degrade instead
# of stopping.
#
# ⚠ EVERY ROUTE HERE WAS CHECKED FOR IDEMPOTENCY BEFORE BEING ADDED, because a
# backstop that double-writes is worse than a dead lane:
#   alerts-dispatch      enqueues alert_deliveries DEDUPED (its own header)
#   alerts-send          "claims pending alert_deliveries for a channel (atomic)
#                         ... then marks each row sent/failed" — cannot double-send
#   *-listings-indexer   block-cursor (`event_cursor`) + upsert onConflict
#   *-listings-retry     `.update()` only, no inserts
#   snapshot-pack-asks   upsert_pack_ask_state (upsert by key)
#   wmc-fmv-populate     populate_* RPCs (write-in-place)
#   pinnacle-events-ingest / ownership-onchain-walk  cursor + onConflict
# All ten are `after()` fire-and-forget behind INGEST_SECRET_TOKEN, so a
# duplicate tick advances a cursor or no-ops.
#
# ⚠ Minutes 12/27/42/57 are GHA-EMPTY on this repo (derived from every `cron:` in
# .github/workflows, not assumed). Two jobs so the user-facing alert lanes cannot
# be starved by a slow ingest step ahead of them in the same job.
#
# ⚠ Every step is `continue-on-error` with `fail-on-status: false`: this is a
# backstop, and a red badge here would compete with the real alarm
# (pipeline-sentinel) rather than add to it. Whether the lanes actually ran is
# read from `pipeline_runs`, not from this workflow's badge.
on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alerts:
    name: Alert delivery lanes (user-facing)
    runs-on: ubuntu-latest
    # 2 steps x (1 retry x 60s + backoff) — generous headroom over ~4 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ⭐ THE SCHEDULER-LIVENESS PROBE (added 2026-09-10 PT). This workflow shipped
      # earlier tonight and its coverage claim rested on TWO hand-fired dispatches;
      # by 04:12Z it had missed SIX consecutive scheduled slots, and GitHub had
      # delivered ZERO scheduled runs repo-wide since 01:30Z against a 7-hour
      # baseline of ~4.3/hour. Nothing in the database could tell that apart from
      # ordinary shedding, because a dispatched run and a scheduled run wrote
      # identical rows — and the only watcher that could have noticed,
      # `pipeline-sentinel`, is itself a GHA `schedule` and died in the same
      # stall. Correlated alarm and subject: the failure this estate keeps
      # repeating.
      #
      # ⭐ WHY HERE AND NOT ONLY ON THE SENTINEL: sampling rate. The sentinel is
      # hourly and GitHub's measured delivery on this repo is ~1 in 3, so a
      # 3-hour gap there is unremarkable and an alarm keyed on it cannot fire
      # quickly without crying wolf. This workflow fires 4x/hour, so the same
      # window carries 12 slots — zero delivered is ~0.8% under the 1-in-3 model
      # instead of ~30%. `rpc_gha_schedule_watchdog()` (pg_cron, every 30 min,
      # an INDEPENDENT scheduler) reads these rows.
      #
      # ⚠ IT MUST NEVER FAIL THE JOB, for the same reason the sentinel's must
      # not: this is telemetry about a backstop, and a broken instrument that
      # reds a badge masks the signal it exists to record. Missing credentials
      # warn and exit 0; the lane calls below still run.
      #
      # ⚠ rows_* stay NULL, never 0 — a heartbeat has measured NOTHING, while a
      # lane writes 0 because it genuinely moved no rows.
      - name: Record which trigger delivered this tick
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::No Supabase credentials on this runner — no heartbeat was written, so for THIS run a shed tick and a delivered one stay indistinguishable."
            exit 0
          fi

          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ) || STARTED=""

          PAYLOAD=$(printf '{"p_pipeline":"dead-lane-backstop-heartbeat","p_started_at":"%s","p_rows_found":null,"p_rows_written":null,"p_rows_skipped":null,"p_ok":true,"p_error":null,"p_collection_slug":null,"p_cursor_before":null,"p_cursor_after":null,"p_extra":{"source":"github-actions","event":"%s","run_id":"%s","run_attempt":"%s"}}' "$STARTED" "${EVENT:-unknown}" "$RUN_ID" "$RUN_ATTEMPT") || PAYLOAD=""

          RESP=$(curl -s --max-time 20 -X POST "$SUPABASE_URL/rest/v1/rpc/log_pipeline_run" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}") || RESP=""

          CODE=$(printf '%s' "$RESP" | tail -1) || CODE=""
          case "$CODE" in
            2*) echo "dead-lane-backstop-heartbeat written (HTTP $CODE), event=${EVENT:-unknown}" ;;
            *)  echo "::warning::heartbeat NOT written (HTTP ${CODE:-none}) — for THIS run a shed tick and a delivered one stay indistinguishable." ;;
          esac
      # Dispatch BEFORE send: dispatch fills the outbox, send drains it. Reversed,
      # a backstop tick delivers nothing until the following tick.
      - name: alerts-dispatch — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/cron/alerts-dispatch
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: alerts-dispatch
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: alerts-send — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/cron/alerts-send
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: alerts-send
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"

  ingest:
    name: High-frequency ingest lanes
    runs-on: ubuntu-latest
    # 8 steps x (1 retry x 60s + backoff) ~= 16 min worst case.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: allday-listings-indexer — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/allday-listings-indexer
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: allday-listings-indexer
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: allday-listings-retry — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/allday-listings-retry
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: allday-listings-retry
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: golazos-listings-indexer — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/golazos-listings-indexer
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: golazos-listings-indexer
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: pinnacle-listings-retry — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/pinnacle-listings-retry
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: pinnacle-listings-retry
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: pinnacle-events-ingest — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/cron/pinnacle-events-ingest
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: pinnacle-events-ingest
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: snapshot-pack-asks — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/cron/snapshot-pack-asks
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: snapshot-pack-asks
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: wmc-fmv-populate — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/wmc-fmv-populate
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: wmc-fmv-populate
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
      - name: ownership-onchain-walk — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/cron/ownership-onchain-walk
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: ownership-onchain-walk
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"

      # ⭐ THE ELEVENTH LANE, ADDED 2026-09-10 PT — it was dead and OUTSIDE this
      # workflow, which is why nothing here covered it.
      #
      # 🚨 IT IS THE ONLY WRITER OF `edition_offers.highest_offer` FOR TOP SHOT.
      # Grep-verified across app/ and lib/: allday-offers-indexer writes All Day's,
      # golazos-offers-indexer writes Golazos's, and offers-sweep writes Top Shot's.
      # Nothing else writes that column. It last wrote on **2026-08-28**, so the
      # "Best offer" on the collection grid, moment and edition pages, /api/best-offers
      # and the `price_gap` in /api/badges have been unrefreshed for 13 days.
      #
      # ⚠ AND THE STALENESS IS INVISIBLE, WHICH IS THE WORSE HALF.
      # `edition_offers.updated_at` reads FRESH for Top Shot — minutes old — because
      # `topshot-deal-floor-serials` stamps `updated_at` while writing only `low_ask`,
      # `low_ask_serial` and `low_ask_nft_id`. It never writes `highest_offer`. So the
      # timestamp vouches for the ask and not for the offer sitting in the same row.
      # ⛔ DO NOT treat `edition_offers.updated_at` as freshness for `highest_offer`.
      #
      # ⚠ THIS STEP IS NOT THE WHOLE FIX, stated plainly so nobody reads it as one.
      # There were TWO failures. The lane stopped WRITING on 08-29 (72 runs/day,
      # rows_written 0, ok_count 36/72 — still unexplained) and stopped RUNNING on
      # 09-07 when cron-job.org went. This step addresses only the second. If it comes
      # back and still writes zero, the first failure is the live one and is the thing
      # to root-cause; either way pipeline_runs can see it again, which it could not
      # while nothing called the route at all.
      #
      # Idempotency checked before adding, same as every lane above: the sweep is
      # cursored across ticks via pipeline_runs.cursor_after and writes through
      # `.upsert(batch, { onConflict: "collection_id,external_id" })` — the same
      # cursor+upsert shape as the listings indexers. ⚠ Its cursor lives in
      # `pipeline_runs`, which retains ~73h, so after this long dead the cursor is
      # gone and the next tick restarts at the head. That is the route's own
      # documented behaviour for reaching the end (cursor_after=null restarts a fresh
      # full refresh cycle), not a new risk.
      - name: offers-sweep — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/cron/offers-sweep
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: offers-sweep
          accept: "200,202"
          retries: "1"
          max-time: "60"
          fail-on-auth: "false"
