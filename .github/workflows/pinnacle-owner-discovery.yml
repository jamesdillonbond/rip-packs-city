name: Pinnacle Owner Discovery + Edition Resolver

# Two Supabase edge functions run on a staggered 6,26,46 cron (off the :00 rush):
#   1. pinnacle-owner-discovery scans A.edf9df96c92f4595.Pinnacle.Deposit
#      events backward in 2000-block windows and upserts nft_id → owner pairs
#      into pinnacle_ownership_snapshots.
#   2. pinnacle-nft-resolver drains pinnacle_sales rows with edition_id IS NULL
#      whose nft_id has a matching ownership snapshot, calls
#      resolve-pinnacle-nft.cdc at the Flow Access API, and promotes the
#      resolved edition_key into pinnacle_nft_map + pinnacle_sales.
#
# Both functions are idempotent and authenticated with the INGEST_SECRET_TOKEN
# Bearer token, matching the convention used by the other RPC edge functions.
#
# ⚠ SCHEDULE COLLISION, acknowledged (CI audit 2026-09-02): cron-job.org's
# "RPC Pinnacle NFT Resolver" also calls pinnacle-nft-resolver every 5 minutes
# (6,11,…,56), so step 2 here lands on the SAME minute as that job on every
# tick (docs/operations/cron-schedule.md). Harmless today: the function is
# idempotent and GitHub sheds this schedule to ~5–7 fires/day (R61), so the
# overlap is a handful of double-calls daily. It is the backstop for the
# cron-job.org job, not a second primary — if that job is ever retired, the
# fail-on-auth default in the composite below should flip back to true.

on:
  schedule:
    - cron: "6,26,46 * * * *"
  workflow_dispatch:
    inputs:
      blocks_per_run:
        description: "Blocks per run for owner discovery"
        required: false
        default: "2000"
      resolver_batch_size:
        description: "Batch size for the NFT resolver"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: pinnacle-owner-discovery
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Two steps at --max-time 300 each; 10 cut the resolver at the job wall.
    timeout-minutes: 12
    steps:
      # The composite below is local, so the tree must be checked out first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Owner Discovery — scan Pinnacle.Deposit events backward
        env:
          BLOCKS: ${{ github.event.inputs.blocks_per_run || '2000' }}
        uses: ./.github/actions/rpc-call
        with:
          url: "https://bxcqstmqfzmuolpuynti.supabase.co/functions/v1/pinnacle-owner-discovery?blocks=${{ github.event.inputs.blocks_per_run || '2000' }}"
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: Owner discovery
          method: GET
          max-time: "300"

      - name: NFT Resolver — resolve (nft_id, owner) pairs into edition_keys
        env:
          BATCH: ${{ github.event.inputs.resolver_batch_size || '25' }}
        uses: ./.github/actions/rpc-call
        with:
          url: "https://bxcqstmqfzmuolpuynti.supabase.co/functions/v1/pinnacle-nft-resolver?batch=${{ github.event.inputs.resolver_batch_size || '25' }}"
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: NFT resolver
          method: GET
          max-time: "300"
