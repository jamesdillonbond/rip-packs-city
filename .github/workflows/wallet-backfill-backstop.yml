name: Wallet Backfill Backstop
# Concurrency-guard + GHA backstop (handoff 2026-06-27, follow-on to Item 4):
# the seed-wallet-refresh 6h sweep (which fans out to wallet-backfill +
# -allday/-pinnacle/-golazos/-ufc per wallet) is triggered ONLY by
# cron-job.org today, as 4 staggered cohort entries
# (?cohort=K&of=4 at 45/59 0,6,12,18 and 13/27 1,7,13,19 UTC). cron-job.org
# auto-disables a job that persistently fails its 30s client cap, so a single
# bad window can silently kill a cohort's wallet refresh.
#
# This workflow is a REDUNDANT BACKSTOP, not a replacement. It is safe to run
# ALONGSIDE the cron-job.org primaries WITHOUT an atomic cutover because the
# per-(collection,wallet) concurrency guard
# (claim_pipeline_lock / audit_20260627_pipeline_run_locks_concurrency_guard)
# makes a concurrent walk a NO-OP: a wallet already being walked by a primary
# cohort is skipped here (logged terminated_reason=skipped_in_progress), so the
# backstop never pays a 2nd on-chain Cadence walk or saturates the Supabase
# pool. The children are also row-idempotent (upsert_wmc_batch ON CONFLICT) and
# skip_cached defaults true (walks only the on-chain->cache diff), so a
# redundant fire mostly no-ops.
#
# Cadence: nominally once per 6h window, ~2h after each primary window start
# (02:38 / 08:38 / 14:38 / 20:38 UTC), so if a primary cohort silently died the
# backstop still refreshes that 6h cycle. Cohorts fire sequentially with sleeps
# to mirror the primaries' intra-wave stagger without holding the runner long.
#
# ⛔⛔ THE TWO TIMING CLAIMS ABOVE ARE ASPIRATIONAL, NOT WHAT HAPPENS. Measured
# 2026-08-29 over the last 30 scheduled runs of THIS workflow: **not one started
# within 5 minutes of its slot** — median **+45 min**, p90 **+205 min**, max
# **+356 min against a 360-min cycle**, i.e. at least one run landed essentially
# a whole cycle late, on top of the window it was meant to backstop.
#
# ⛔ So the deleted sentence "Minute :38 is GHA-empty (rpc-pipeline 5,25,45;
# allday-ingest 10,30,50; …)" bought NOTHING and is removed rather than reworded:
# it reasoned about a minute GitHub does not honour. **Do not re-derive a
# collision-free minute here.** It is not a scheduling knob on this platform.
#
# ⚠ This is not specific to this workflow. Across all 16 scheduled workflows in
# this repo, 449 sampled runs: **14.9 % started within 5 min of schedule**, and
# of the DAILY ones (where the measurement cannot be censored by a short cycle)
# **0 of 73** did, with maxima of 720–737 min (~12 h). The sparser the schedule,
# the worse the delay. Full filing:
# docs/overnight/inbox/2026-08-29T2230Z-github-actions-schedules-are-not-honoured.md
#
# ⭐ CONSEQUENCE FOR ANY FIX HERE: "move it to a quiet hour" is NOT an available
# lever — a GHA-scheduled job cannot be placed in an hour band. If this backstop's
# timing ever has to be real, it must move to a scheduler that honours time
# (pg_cron or cron-job.org, which the primaries already use), or be retired.
#
# OPERATOR end-state (optional, secret-gated — do NOT do from a code session):
# the cron-job.org "RPC Seed Wallet Refresh" cohort entries can later be
# disabled for a single clean trigger; until then dual-trigger is intentional
# and harmless thanks to the guard.
#
# &force=1 IS LOAD-BEARING (2026-07-18) — do not drop it. /api/seed-wallet-refresh
# carries a 12h cadence gate (cost lever) that skips any wave where
# utcHour%12>=2. This workflow's hours are 2,8,14,20 — ALL of which the gate
# would skip — so without ?force=1 every backstop invocation silently no-ops
# and the redundancy for cron-job.org trigger dropout disappears. If the gate
# is ever removed from the route, ?force=1 becomes a harmless no-op param.
on:
  schedule:
    - cron: "38 2,8,14,20 * * *"
  workflow_dispatch:
jobs:
  seed-wallet-refresh-cohorts:
    runs-on: ubuntu-latest
    # EXPERIMENT (deep-audit run 4, 2026-08-27; specified by inbox 2026-08-28T0420Z):
    # this backstop was measured 73.1% killed (n=788) vs the cron-job.org primaries'
    # 17.0% — its cohorts fire 60s apart and a batch of 30+ dispatched in one minute
    # runs ~50-78% killed. Widening the intra-cohort sleep 60->300s is the specified
    # experiment; timeout-minutes must rise in the SAME commit because 3x300s sleeps
    # alone exceed the old 10-min job wall (without it the last cohorts never fire).
    # FALSIFIER: if the backstop's kill share does not fall materially at 300s
    # spacing, spacing is not the lever — the 14:38Z hour band dominates and the
    # next lever is moving the schedule, not the stagger.
    timeout-minutes: 25
    steps:
      - name: Seed wallet refresh — cohorts 0..3 (backstop trigger)
        continue-on-error: true
        run: |
          for K in 0 1 2 3; do
            STATUS=$(curl -s --retry 3 --retry-all-errors --max-time 30 -o "/tmp/seed-$K.json" -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
              "https://www.rippackscity.com/api/seed-wallet-refresh?cohort=$K&of=4&force=1") || STATUS=""
            echo "seed-wallet-refresh cohort=$K/4 status: $STATUS"
            cat "/tmp/seed-$K.json" || true
            echo ""
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
              echo "::warning::seed-wallet-refresh cohort=$K returned $STATUS"
            fi
            if [ "$K" != "3" ]; then sleep 300; fi
          done
