name: Smoke Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 12 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Needed for scripts/smoke-gate.py (the response gate).
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 45

      - name: Run smoke tests
        run: |
          # ⚠ THE LIVE CONCIERGE PROBE RUNS ONLY ON THE SCHEDULED/DISPATCH RUN,
          # NEVER ON PUSH. This workflow also triggers on every push to main, and
          # with concurrent sessions pushing every couple of minutes `?concierge=1`
          # there would mean ~720 real Anthropic calls/day. That is precisely the
          # cost that gets a check made optional, and an optional check is not a
          # monitor — the reason the concierge could die for fourteen days with
          # every instrument green.
          #
          # Why pin it here at all: the route's own fallback window is ~09:00–09:24
          # UTC and fires only if some caller happens to tick inside it, so the
          # daily live probe was INCIDENTAL — and this job, the one guaranteed
          # caller, runs at 12:11 UTC and missed it entirely. One scheduled call a
          # day makes it deterministic for fractions of a cent.
          URL="https://www.rippackscity.com/api/smoke-test"
          if [ "${{ github.event_name }}" != "push" ]; then
            URL="${URL}?concierge=1"
            echo "Live concierge probe ENABLED (event=${{ github.event_name }})"
          else
            echo "Live concierge probe skipped (push event — see comment above)"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            -H "Content-Type: application/json") || RESPONSE=""

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Smoke test endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Gate on the keys the route ACTUALLY returns (hardPassed/hardTotal +
          # per-result soft flags). The old inline check read a `failed` key the
          # route never emits, so it passed unconditionally; the gate now fails
          # loudly if any expected key is absent. See scripts/smoke-gate.py.
          echo "$BODY" | python3 scripts/smoke-gate.py
