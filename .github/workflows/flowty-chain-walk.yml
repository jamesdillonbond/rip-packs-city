name: Flowty chain walk (verify Flowty's index against the chain)

# 2026-10-03. Reads every Flowty NFTStorefrontV2 ListingCompleted event from the Flow history
# nodes (access-001.mainnet24..27, /v1/events, 250-block windows) between the mainnet24 root
# (65,264,619, 2023-11-08) and the mainnet28 floor (137,390,145, 2025-12-29), and lands the
# purchased ones + per-window coverage through public.ingest_flowty_chain_walk (service role).
# It is the independent reader that verifies flowty_archive.flowty_index_sales before any
# Flowty-venue sale reaches `sales`. Moved here from pg_net, where its slow windows stalled
# the shared worker for every production lane (migration 20261004022627). Resumable: a
# re-run skips windows already in flowty_archive.flowty_chain_walk_coverage (a job that hit its
# time limit loses nothing it landed). Coverage proof is the coverage table, not this run's
# exit code. Throughput is bounded per NODE (~9 windows/s measured on mainnet26 with 4 jobs;
# six parallel jobs on mainnet24 landed 0 windows in 10 min), so the matrix sets concurrency
# per node; each job stops cleanly at MAX_MINUTES and a re-dispatch resumes. workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      rps:
        description: "requests/second per job (nodes throttle per-second bursts)"
        required: false
        default: "4"
        type: string
      nodes:
        description: "nodes to walk (comma-separated, exact names from mainnet24..27); the mainnet24 range walk is a RECALL sample only — its era is verified per transaction by flowty-tx-verify.yml, and its slow /v1/events reads starve that verifier"
        required: false
        default: "mainnet25,mainnet26,mainnet27"
        type: string

permissions:
  contents: read

concurrency:
  group: flowty-chain-walk
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10   # = the whole matrix: per-NODE concurrency is set by the rows below
      matrix:
        include:
          - { node: mainnet24, start: 65264619, end: 75623118, workers: 12 }
          - { node: mainnet24, start: 75623119, end: 85981134, workers: 12 }
          - { node: mainnet25, start: 85981135, end: 88226266, workers: 16 }
          - { node: mainnet26, start: 88226267, end: 95237016, workers: 10 }
          - { node: mainnet26, start: 95237017, end: 102247766, workers: 10 }
          - { node: mainnet26, start: 102247767, end: 109258516, workers: 10 }
          - { node: mainnet26, start: 109258517, end: 116269266, workers: 10 }
          - { node: mainnet26, start: 116269267, end: 123280016, workers: 10 }
          - { node: mainnet26, start: 123280017, end: 130290658, workers: 10 }
          - { node: mainnet27, start: 130290659, end: 137390145, workers: 16 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Walk ${{ matrix.node }} ${{ matrix.start }}-${{ matrix.end }}
        env:
          RPS: ${{ github.event.inputs.rps }}
          NODES: ${{ github.event.inputs.nodes }}
          WORKERS: ${{ matrix.workers }}
          MAX_MINUTES: "320"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Supabase secrets not configured"; exit 2
          fi
          case "${RPS:-}" in (''|*[!0-9.]*) echo "rps must be a number"; exit 2;; esac
          case ",${NODES}," in (*",${{ matrix.node }},"*) ;; (*) echo "${{ matrix.node }} not in nodes=${NODES} — skipped"; exit 0;; esac
          python3 scripts/flowty-export/test_chain_walk_gha.py
          python3 scripts/flowty-export/chain_walk_gha.py "${{ matrix.node }}" "${{ matrix.start }}" "${{ matrix.end }}"
