name: Badge Sync — Refresh badge_editions low_ask + tags
on:
  schedule:
    # Every 6 hours (00:15, 06:15, 12:15, 18:15 UTC). The :15 offset keeps it
    # off the busy :00/:20/:40 slots already used by rpc-pipeline + alerts.
    - cron: "15 */6 * * *"
    # Catalog-walk sweep (audit 2026-06-09, handoff 2026-06-10 Item 4): drains
    # badge_editions coverage 3,138 -> ~9,136 canonical TS editions via the
    # cursored ?mode=catalog pass. 4 ticks/day at :45 (off the :00/:20/:40
    # anchors and off this workflow's own :15 tag sweep; it DOES share :45 with
    # rpc-pipeline's 5,25,45, a 4-way landing four times a day -- see
    # topshot-listing-cache.yml). The route runs up to
    # ~300s synchronously, so it lives here (GHA curl --max-time 600), NOT on
    # cron-job.org (30s client cap would mark every run failed + risk
    # auto-disable). Once coverage converges this becomes the continuous
    # circulations/burns refresher.
    - cron: "45 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      catalog:
        description: "Run the catalog-walk sweep instead of the tag sweep"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 2026-08-30: public-api.nbatopshot.com has answered Cloudflare 530/1033 (origin tunnel down) since
  # 2026-08-28 ~17Z; every tick of both jobs below spent its full run on 530s and logged a failed
  # pipeline_runs row (topshot-badge-sync 0/5 sweeps, topshot-badge-catalog 5/5 failed). This probe
  # gates them on the upstream being reachable, so the workflow self-resumes the tick after the host
  # returns and nobody has to remember to re-enable it. Only a Cloudflare 52x/530 or a connection
  # failure counts as dead -- any other status (200, 4xx, even a bot-challenge 403) lets the jobs run,
  # so a runner-IP block can never mask a live host.
  upstream-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      alive: ${{ steps.probe.outputs.alive }}
    steps:
      - id: probe
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -X POST \
            -H "content-type: application/json" --data "{\"query\":\"{__typename}\"}" \
            https://public-api.nbatopshot.com/graphql) || STATUS="000"
          echo "public-api.nbatopshot.com/graphql -> $STATUS"
          case "$STATUS" in
            000|52[0-9]|530) echo "alive=false" >> "$GITHUB_OUTPUT"; echo "::warning::Top Shot public API is down ($STATUS) -- skipping this tick" ;;
            *) echo "alive=true" >> "$GITHUB_OUTPUT" ;;
          esac
  badge-sync:
    # Tag sweep: the :15 schedule, or manual dispatch without the catalog flag.
    needs: upstream-probe
    if: needs.upstream-probe.outputs.alive == 'true' && (github.event.schedule == '15 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.catalog != true))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # The composite below is local, so the tree must be checked out first.
      - uses: actions/checkout@v4
      - name: Top Shot badge sync (also chains AllDay + Golazos seed)
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/badge-sync
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: Badge sync
          max-time: "600"
  badge-catalog-sweep:
    needs: upstream-probe
    if: needs.upstream-probe.outputs.alive == 'true' && (github.event.schedule == '45 2,8,14,20 * * *' || (github.event_name == 'workflow_dispatch' && inputs.catalog == true))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # The composite below is local, so the tree must be checked out first.
      - uses: actions/checkout@v4
      - name: Top Shot badge catalog-walk sweep (cursored full-catalog)
        uses: ./.github/actions/rpc-call
        with:
          url: "https://www.rippackscity.com/api/badge-sync?mode=catalog"
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: Badge catalog sweep
          max-time: "600"
