name: Badge Sync — Refresh badge_editions low_ask + tags
on:
  schedule:
    # Every 6 hours (00:15, 06:15, 12:15, 18:15 UTC). The :15 offset keeps it
    # off the busy :00/:20/:40 slots already used by rpc-pipeline + alerts.
    - cron: "15 */6 * * *"
    # Catalog-walk sweep (audit 2026-06-09, handoff 2026-06-10 Item 4): drains
    # badge_editions coverage 3,138 -> ~9,136 canonical TS editions via the
    # cursored ?mode=catalog pass. 4 ticks/day at :45 (off the :00/:20/:40
    # anchors and off this workflow's own :15 tag sweep). The route runs up to
    # ~300s synchronously, so it lives here (GHA curl --max-time 600), NOT on
    # cron-job.org (30s client cap would mark every run failed + risk
    # auto-disable). Once coverage converges this becomes the continuous
    # circulations/burns refresher.
    - cron: "45 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      catalog:
        description: "Run the catalog-walk sweep instead of the tag sweep"
        type: boolean
        default: false
jobs:
  badge-sync:
    # Tag sweep: the :15 schedule, or manual dispatch without the catalog flag.
    if: github.event.schedule == '15 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.catalog != true)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Top Shot badge sync (also chains AllDay + Golazos seed)
        run: |
          STATUS=$(curl -s -o /tmp/badge-sync.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            --max-time 600 \
            https://www.rippackscity.com/api/badge-sync)
          echo "Badge sync status: $STATUS"
          cat /tmp/badge-sync.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Badge sync returned $STATUS"
          fi
  badge-catalog-sweep:
    if: github.event.schedule == '45 2,8,14,20 * * *' || (github.event_name == 'workflow_dispatch' && inputs.catalog == true)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Top Shot badge catalog-walk sweep (cursored full-catalog)
        run: |
          STATUS=$(curl -s -o /tmp/badge-catalog.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            --max-time 600 \
            "https://www.rippackscity.com/api/badge-sync?mode=catalog")
          echo "Badge catalog sweep status: $STATUS"
          cat /tmp/badge-catalog.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Badge catalog sweep returned $STATUS"
          fi
