name: RPC Ops Monitor

on:
  schedule:
    - cron: '13,43 * * * *'
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmv-staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check FMV staleness
        run: |
          # NOTE: this job runs under `bash -e`. curl's OWN failure (a --max-time
          # timeout exits 28) would abort the step at the assignment above, so the
          # retry loop below never ran and a single timeout red the monitor -- the
          # exact case this retry was written to tolerate. `|| true` keeps the
          # script alive so HTTP_CODE (empty on timeout) drives the decision.
          # Retry on transient non-200 (the endpoint can 504 during cron-saturation
          # windows). Fail only if all attempts are non-200, so a single blip doesn't
          # red the monitor.
          HTTP_CODE=""
          BODY=""
          for attempt in 1 2 3; do
            RESPONSE=$(curl -s --max-time 35 -w "\n%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
              "https://www.rippackscity.com/api/cron/stale-fmv-monitor") || true
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            echo "Attempt $attempt — HTTP Status: $HTTP_CODE"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

            if [ "$HTTP_CODE" = "200" ]; then
              STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null) || STATUS=""
              if [ "$STATUS" = "stale" ]; then
                echo "::warning::FMV data is stale! $(echo "$BODY" | jq -r '.fmv_staleness_minutes') minutes since last compute."
              fi
              exit 0
            fi

            echo "Non-200 (attempt $attempt) — retrying in 10s..."
            sleep 10
          done

          echo "::error::stale-fmv-monitor returned non-200 after 3 attempts (last: $HTTP_CODE)"
          exit 1

  # Daily at 06:41 UTC ('41 6 * * *') + manual dispatch. Re-enabled 2026-06-26 after
  # app/api/cron/data-integrity was rebuilt: dropped the ~14.7s health_check() call
  # (it was 504'ing the 15s lambda) and the noisy orphan-as-issue checks (the
  # ~4.7k null-set / ~10.5k null-player counts are stable baselines — inert UUID-dupe
  # TS editions + legitimately player-less award/team cards — now informational stats
  # only). Flagged checks are all clean 0/healthy baselines (security invariants +
  # badge freshness), so a green scheduled run is expected.
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '41 6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check data integrity
        run: |
          RESPONSE=$(curl -s --max-time 35 -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            "https://www.rippackscity.com/api/cron/data-integrity") || true

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          # jq exits 5 on a non-JSON body (an HTML 504 page). Guarded defensively --
          # though the line that actually aborted the step was the jq inside the branch
          # below, not this one. Both are the same class; the first fix here was not
          # enough and only a live re-run showed it.
          ISSUE_COUNT=$(echo "$BODY" | jq -r '.issue_count' 2>/dev/null) || ISSUE_COUNT=""

          # -n guard: a body we could not parse leaves ISSUE_COUNT empty, and empty is
          # NOT a count of issues. Without it this printed "::warning:: data integrity
          # issues found" off a 504 HTML page -- a failed read rendered as a finding.
          # The trailing || true is the same -e abort as above: jq exits 5 on that body,
          # and this was the LAST command in the branch, so it killed the step before the
          # HTTP_CODE check could name the 504. Verified live 2026-08-18.
          if [ -n "$ISSUE_COUNT" ] && [ "$ISSUE_COUNT" != "0" ] && [ "$ISSUE_COUNT" != "null" ]; then
            echo "::warning::$ISSUE_COUNT data integrity issues found"
            echo "$BODY" | jq -r '.issues[]' 2>/dev/null || true
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::data-integrity returned HTTP $HTTP_CODE"
            exit 1
          fi

  # ── CI status watch (added 2026-07-19; corrected 2026-09-14) ────────────────
  # Closes a real detection gap: main's `unit-tests` job sat RED for ~24h
  # completely undetected (monitor inbox 2026-07-19T0306Z). Nothing in the repo
  # or in the scheduled monitors ever read a GitHub Actions conclusion — the
  # sweeps check the DB, Vercel and Sentry, but CI was invisible.
  #
  # 🚨 CORRECTED 2026-09-14 — IT HAD THE SAME BLIND SPOT IT WAS BUILT TO CLOSE.
  # It took the FIRST element of the runs list — the newest COMPLETED run of
  # ANY KIND — and called main green when it said `success`. But the shard job is
  # gated on `code == 'true'`, so a DOCS-ONLY push produces a green run in which
  # the suite never executed. A red introduced by a code push, followed by any
  # docs push, therefore read as GREEN here — which is exactly the "red for 24h,
  # undetected" scenario this job exists for, reintroduced by the docs-only fast
  # path. Measured the same day in `inherited-status`'s own published summary,
  # which reported a docs-only commit as "last full-suite run".
  #
  # Now delegates to the shared script, which finds the last run that ACTUALLY
  # ran the shards (a job NAME in the jobs list is not evidence it ran — skipped
  # jobs are listed too, with `conclusion: "skipped"`), skips cancelled runs as
  # inconclusive rather than alarming on supersession, and fails open loudly when
  # it cannot read the history. One implementation, one test suite
  # (`__tests__/inherited-main-status-guard.test.ts`), two callers.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Pure node + the Actions API. No npm ci — nothing here needs deps.
      - name: Last run on main that actually ran the suite
        run: node scripts/check-last-code-ci-on-main.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
