name: Flowty tx verify (mainnet24-era index rows, one transaction each)

# 2026-10-03. For the mainnet24 era (2023-11-08 .. 2024-09-04) the block-range walk is ~57 h
# (/v1/events ~60 s per window on that node) while /v1/transaction_results answers in < 0.5 s, so
# every Flowty-index storefront sale of that era is checked against ITS OWN transaction:
# Sealed, no error, and the exact ListingCompleted(purchased=true) for its listing id with the
# same nft / price / buyer / seller / vault. Verdicts land via public.ingest_flowty_tx_verdicts
# (migration 20261004031134); promote_flowty_tx_verified_sales promotes only 'chain_sealed' rows.
# Sharded by md5(doc_id); re-runnable (only rows without a verdict are read). workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      rps:
        description: "requests/second per shard"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: flowty-tx-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shard ${{ matrix.shard }}/6
        env:
          RPS: ${{ github.event.inputs.rps }}
          WORKERS: "16"
          MAX_MINUTES: "320"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Supabase secrets not configured"; exit 2
          fi
          case "${RPS:-}" in (''|*[!0-9.]*) echo "rps must be a number"; exit 2;; esac
          python3 scripts/flowty-export/test_chain_walk_gha.py
          python3 scripts/flowty-export/chain_verify_tx_gha.py "${{ matrix.shard }}" 6
