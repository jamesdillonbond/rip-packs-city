name: Migration parity

# Daily check that every migration APPLIED TO PRODUCTION recently also has a
# committed file in supabase/migrations/.
#
# WHY THIS EXISTS
# ---------------
# Migrations reach prod two ways here: `supabase db push` (file first) and the
# Supabase MCP `apply_migration` (applied first, file committed afterwards by
# whoever ran it). The second path is normal and heavily used — but the repo
# record is a MANUAL follow-up, so any session that cannot push leaves production
# ahead of the repo with nothing to notice.
#
# Three consecutive autonomous runs hit exactly that, via two unrelated causes:
#   * 2026-08-08 + 2026-08-09 night: `useradd … /sessions no space left on device`
#     — the workspace shell would not start, so no git at all.
#   * 2026-08-09 daytime: git-proxy 403, "repo is not in this session's authorized
#     repository set, so the proxy will not inject a credential".
# Each applied DB changes via MCP and could not commit the files. The consequence
# is the same and it is the dangerous part: production state the repo cannot
# describe, so the revert path exists only in a session transcript.
#
# This job makes that visible within a day instead of whenever someone happens to
# look. It is the containment for a push outage, NOT a fix for one — restoring
# push is separate (see the ledger entry dated 2026-08-09).
#
# The check READS ONLY supabase_migrations.schema_migrations — it mutates nothing.
#
# POSTURE — ENFORCING since 2026-08-20. It was introduced reporting-only, for a
# stated and correct reason: at a 14-day window the first real run found 114
# pre-existing fileless migrations, a historical backlog nobody had scheduled,
# and failing daily on it would have trained everyone to ignore the job — the
# "permanently red arm" failure mode. The exit condition recorded here was
# "delete the `|| true` once the backlog is cleared".
#
# ⚠ THAT CONDITION WAS MET AND NOBODY RE-CHECKED, which is the recorded shape of
# a decision-not-to-act. RE-DERIVED 2026-08-20 against the live table, not quoted
# from this comment: the 14-day backlog is 5, not 114 — and all 5 are one
# afternoon's `rpc_search_catalog` v2/v3/v4 prototypes plus their own drops,
# recovered byte-exactly from prod (md5-verified against
# `md5(array_to_string(statements, E'\n'))`) and committed in the same commit
# that flipped this posture. Backlog at 3d / 7d / 14d is now 0 / 0 / 0.
#
# ⚠ WHY THE EXIT CODE IS CAPTURED RATHER THAN LEFT TO STAND. Every `run:` block
# here is `bash -e`, so simply deleting the `|| true` would abort the step ON the
# npm line and leave BOTH greps below as dead code — the annotations that name
# WHICH migrations drifted would never print, on exactly the run where they
# matter. So the status is captured with `|| RC=$?`, the annotations run, and the
# step exits with the captured code at the end. Exit 2 (the check could not run
# at all) fails too: a check that cannot answer is not a pass.
#
# The window stays at 3 days — short enough that a red run always means a FRESH
# push outage, never a backlog. This is a daily schedule, not a PR gate, so a red
# run is a notification and blocks nobody's merge.
#
# OPERATOR NOTE: needs NEXT_PUBLIC_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY repo
# secrets (both already exist — db-pin-staleness.yml uses them). Without them it
# soft-skips green.

on:
  schedule:
    # 07:40 UTC — after db-pin-staleness's 07:20 slot so the two secret-bearing DB
    # sweeps never overlap.
    - cron: '40 7 * * *'
    # ── 15:50 + 23:50 added 2026-08-24: DAILY WAS A 14-HOUR BLIND WINDOW ───────
    # The 2026-08-23 filing measured it: two independent drift batches opened and
    # one closed inside twelve hours, and the second batch (applied 17:29-19:28Z)
    # would have gone unnamed until 07:40Z the next morning. Anyone reading a
    # green-since-recovery badge that evening would have concluded the repo
    # describes production. It did not.
    #
    # ⚠ THE FIX IS CADENCE, NOT A WIDER LOOK-BACK. That filing says so twice, and
    # it is right: widening the window_days input drags in ~2,000 historical
    # non-actionable rows and makes the report unreadable — the 'permanently red
    # arm' failure this job's own POSTURE note was written about.
    #
    # Three slots at 8-hour spacing put the worst case at ~8h instead of ~24h.
    # ⓘ Precedent, and the same argument: db-pin-staleness moved weekly -> daily on
    # 2026-08-10 for exactly this reason ('weekly meant up to 7 days of silent
    # drift; daily closes that to <=24h'). This job reads only
    # supabase_migrations.schema_migrations and mutates nothing, so the added cost
    # is two ~30s read-only runs a day.
    #
    # ⚠ Minutes chosen to dodge the busy slots, not by taste: ops-monitor runs at
    # :13/:43 every hour and e2e-smoke at :41 every 6h (...,17:41,23:41), so :50
    # clears both with room either side. Re-check that list before adding a fourth.
    - cron: '50 15 * * *'
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      window_days:
        description: 'Look-back window in days (default 3; use 14 to see the full backlog)'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  migration-parity:
    name: Prod migrations vs committed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compare applied migrations against supabase/migrations/
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_PARITY_WINDOW_DAYS: ${{ github.event.inputs.window_days || '3' }}
        run: |
          set -uo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not configured — skipping the migration-parity check."
            exit 0
          fi
          # 0 clean · 1 drift · 2 config/query error.
          # 2>&1 is LOAD-BEARING: every drift line is console.error, and a bare pipe
          # captures stdout only — so parity.log held just the one-line summary and
          # BOTH greps below silently never matched. Verified empirically 2026-08-10;
          # it means the drift annotation had never fired, including on the run that
          # found 114 fileless migrations. Do not "tidy" the redirect away.
          #
          # ⚠ `|| RC=$?` is what keeps the annotations reachable. This block runs
          # under `bash -e`, so a bare failing pipeline would abort the step HERE and
          # the two greps would never execute — dead code that reads as coverage, on
          # precisely the run that found something. Capture, annotate, then exit.
          RC=0
          npm run db:migrations:check 2>&1 | tee parity.log || RC=$?
          if grep -q 'applied to PRODUCTION with no committed file' parity.log; then
            echo "::error::Production is ahead of supabase/migrations/ — a migration was applied (probably via MCP) and its file was never committed, so it has no committed revert path. See the job log for the list."
          fi
          # Distinct annotation: the file EXISTS but was never `git add`ed. Cheapest fix
          # of the two, and the state a push outage leaves behind — worth its own line.
          if grep -q '^UNTRACKED (' parity.log; then
            echo "::error::A migration .sql exists in the working tree but was never committed. One 'git add' closes it — see the [UNTRACKED] rows in the job log."
          fi
          if [ "$RC" -eq 2 ]; then
            echo "::error::migration-parity could not RUN (config or query error). A check that cannot answer is not a pass — see the job log."
          fi
          exit "$RC"
