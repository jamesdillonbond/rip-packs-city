name: Sale-block reads (name sold NFTs no checkpoint holds)

# 2026-10-04. For chain-verified Flowty / Dapper-contract sales whose NFT appears in no spork-root
# checkpoint (burned after the sale), read the BUYER's collection at the sale's own block on the
# history node of its spork, and land set / play / serial / subedition (Top Shot), edition / serial
# (All Day) or set / serial (UFC) as public.checkpoint_nft_meta spork code 1 through
# public.ingest_sale_block_reads (migration 20261004161541). Candidates live in
# flowty_archive.sale_block_read_candidates; only rows without a verdict are read, so a re-run
# resumes. Sharded by md5(candidate key). workflow_dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sale-block-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # Per NODE: the history nodes throttle independently (mainnet26 429s script bursts), so each node has
      # its own shard set and the reader paces each node adaptively; a slow node no longer stalls the rest.
      matrix:
        include:
          - { nodes: "mainnet24", shard: 0, of: 3, rps: 4 }
          - { nodes: "mainnet24", shard: 1, of: 3, rps: 4 }
          - { nodes: "mainnet24", shard: 2, of: 3, rps: 4 }
          - { nodes: "mainnet26", shard: 0, of: 2, rps: 3 }
          - { nodes: "mainnet26", shard: 1, of: 2, rps: 3 }
          - { nodes: "mainnet25,mainnet27,mainnet28", shard: 0, of: 1, rps: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read ${{ matrix.nodes }} shard ${{ matrix.shard }}/${{ matrix.of }}
        env:
          RPS: ${{ matrix.rps }}
          NODES: ${{ matrix.nodes }}
          WORKERS: "12"
          MAX_MINUTES: "320"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Supabase secrets not configured"; exit 2
          fi
          python3 scripts/flowty-export/test_chain_walk_gha.py
          cd scripts/flowty-export
          python3 sale_block_read_gha.py "${{ matrix.shard }}" "${{ matrix.of }}"
