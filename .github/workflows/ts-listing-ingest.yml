name: TS Listing Ingest

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch and upsert Top Shot listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLOWTY_PROXY_TOKEN: ${{ secrets.FLOWTY_PROXY_TOKEN }}
        run: node scripts/ts-ingest.js
