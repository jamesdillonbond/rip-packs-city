name: CI

# Audit 2026-05-20 (F6): nothing previously gated build / type-check before code
# reached main. This workflow blocks a broken build on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repo; the cadence jobs read secrets.GITHUB_TOKEN only
# to authenticate the Flow CLI version lookup, which `contents: read` covers.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines.node ("24.x") and @types/node ^24.
          # Previously '20' — Vercel deploys on Node 24 by default so the
          # build passed there, but tsc against @types/node v24 on Node 20
          # surfaces type errors in the CI lambda that production never sees.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Brand-token regression guard — fails if a Phase-1-cleaned public surface
      # regrows a hardcoded #E03A2F / 'Barlow Condensed' / 'Share Tech Mono'
      # literal instead of the var(--rpc-*) tokens. Pure node, no deps.
      - run: node scripts/check-brand-tokens.mjs
        # ⚠ Runs even when an EARLIER step in this job failed (the five guards below
        # carry a one-line pointer to this note). These six guards sit
        # after `npx tsc --noEmit`, and GitHub skips every later step when one fails,
        # so ANY type error silently switched all six OFF — observed 2026-08-28, run
        # 33142460652: one unused `@ts-expect-error` reddened tsc and the job report
        # shows all six `skipped`. Nothing said the guards had not run; the job simply
        # named the tsc error. They are independent of tsc and of each other, and are
        # pure node with no deps, so there is no reason to gate them on it.
        # `!cancelled()` rather than `always()`: a cancelled run should stop.
        if: ${{ !cancelled() }}
      # Memory-doc link guard — fails if a relative link in CLAUDE.md or
      # docs/reference/**.md stops resolving. The 2026-08-17 restructure bet the
      # memory architecture on those pointers: detail was moved OUT of CLAUDE.md
      # and replaced with one-line links, so a dead pointer reads as "never
      # written" rather than "broken". Ban at population zero (the gated set was
      # brought to 0 in the commit that added this). Pure node, no deps.
      # ⚠ Deliberately NOT tree-wide: 558 of 919 relative links under docs/ are
      # broken, almost all in docs/sessions, docs/overnight and docs/archive,
      # which are frozen history CLAUDE.md forbids rewriting — gating those
      # would make this permanently red and therefore unreadable.
      - run: node scripts/check-memory-doc-links.mjs
        # Runs even if tsc failed — same reason as check-brand-tokens above.
        if: ${{ !cancelled() }}
      # Driver-message leak guard — fails if an UNGATED route handler returns a
      # raw `err.message` to the client. lib/api-error.ts exists because
      # /api/sets showed anonymous visitors Postgres's own "canceling statement
      # due to statement timeout". Ban at population zero for ungated handlers;
      # the ~53 operator-gated sites (admin/cron/ingest, reached with a secret)
      # are diagnostic and deliberately ignored.
      # ⚠ The exclusion is PER HANDLER, not per file: a gated POST does not vouch
      # for the ungated GET beside it. That exact shape was 4 live handlers.
      - run: node scripts/check-driver-message-leaks.mjs
        # Runs even if tsc failed — same reason as check-brand-tokens above.
        if: ${{ !cancelled() }}
      # Unhandled-third-state guard — bans `if (error) {…} else if (data) {…}`
      # with no final else. A read returning NEITHER an error nor a payload then
      # renders nothing at all. The measured instance was the sentinel's headline
      # FMV-confidence arm, which VANISHED from its own report rather than saying
      # it could not be read — silence in an alert cannot be falsified.
      # Ban at population zero (measured: 1 instance, fixed). The script runs a
      # positive AND a negative control on synthetic fixtures before reporting, and
      # fails if it inspected nothing.
      - run: node scripts/check-unhandled-third-state.mjs
        # Runs even if tsc failed — same reason as check-brand-tokens above.
        if: ${{ !cancelled() }}
      # Responsive flex-basis guard — fails if an inline `flex: "1 1 300px"`
      # sits in a file that also uses a class whose flex-direction CHANGES at a
      # breakpoint. flex-basis sizes the MAIN axis, so a width-basis becomes a
      # HEIGHT under the flip, and an inline style is the one declaration a
      # media query cannot override. That shipped: WalletSearchBand measured
      # 350px tall at 390x844 against the ~100px it specified, above the fold on
      # every /[collection]/* and /insights/* page, while desktop stayed correct
      # at 82px — which is why every gate in this file stayed green through it.
      # (eslint was clean on those files too, though note this repo does NOT run
      # eslint in CI at all — do not cite it as coverage anywhere.)
      # Ban at population zero (0 when this landed). Pure node.
      # ⚠ Joins by CLASS NAME, not by resolved DOM ancestry, so a hit is
      # something to LOOK AT. It asserts its own reach (files, media blocks,
      # responsively-directed classes) and fails loudly rather than passing
      # vacuously if the CSS parser stops seeing anything — the first cut
      # reported 3 in-scope files when the real number was 32.
      - run: node scripts/check-responsive-flex-basis.mjs
        # Runs even if tsc failed — same reason as check-brand-tokens above.
        if: ${{ !cancelled() }}
      # Unbounded-server-read RATCHET — the count of async server page/layout
      # files under app/** that can reach a Supabase read with no budget
      # primitive may only FALL. Fourth occurrence of one class, same error
      # string every time ("Timed out acquiring connection from connection
      # pool"): first-mint, /analytics/sets, two ERRORed production builds on
      # /insights/market(+pulse), and on 2026-08-22 four collections' /overview
      # hanging 30s. The existing BAN
      # (__tests__/insights-server-pages-bound-their-reads.test.ts) walks
      # app/insights, so every one of these was outside it BY CONSTRUCTION.
      # ⚠ A ratchet, not a ban: the population cannot be driven to zero in one
      # pass (several pages have no degraded branch to reject INTO yet, and
      # bounding those turns a slow page into an error boundary). Lower the
      # ceiling in the commit that bounds a page; never raise it. Pure node.
      - run: node scripts/check-unbounded-server-reads.mjs
        # Runs even if tsc failed — same reason as check-brand-tokens above.
        if: ${{ !cancelled() }}

  # Cadence type-check harness for the purchase-moment transaction (canonical
  # source: lib/chains/flow/cadence/purchase-moment.ts after the 2026-05-30
  # Phase-D reorg; lib/cadence/purchase-moment.ts is a re-export shim).
  # The C1/C2 compile errors that docs/cadence-testing.md once described are
  # fixed (FungibleToken is imported; self.listing is borrowed before its price
  # is read). Confirmed green locally on 2026-05-30: `npm run test:cadence`
  # exits 0 (0 errors, 2 allowed string-template warnings). This job is now a
  # true BLOCKING regression gate — any future type error in the production
  # transaction fails the build. Revert: re-add `continue-on-error: true`.
  eslint-ratchet:
    name: ESLint ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # ⚠ THIS REPO DELIBERATELY DOES NOT GATE ON ESLINT, and the comment in the
      # typecheck job says so. Measured 2026-08-29 over 2,857 files: 6,474
      # violations, of which 5,757 (89%) are `@typescript-eslint/no-explicit-any`
      # — a DOCUMENTED CONVENTION here ("Supabase client typed `any` in API
      # routes"). Turning eslint on as a gate would be a 6,000-error wall that
      # gets switched off within a day, so the absence was a rule-set mismatch
      # rather than neglect.
      #
      # What ships instead is a RATCHET over the other 717 violations in 19
      # rules — the repo's own answer to this shape, as with the coverage gates
      # and the fabricated-divisor ratchet. Counts may only shrink; a regression
      # is loud on the commit that introduces it. Several of the ratcheted rules
      # are correctness rather than style: react-hooks/set-state-in-effect (59),
      # @next/next/no-html-link-for-pages (114), react-hooks/purity (6).
      #
      # ⚠ `|| true` is required, not sloppy: eslint exits 1 whenever it reports
      # an error, which is the normal state here, and this is `bash -e`. It does
      # NOT hide a crash — if eslint fails to start, the report file is absent
      # and the checker exits 2 rather than reporting an all-clear, because
      # "eslint found nothing" and "eslint did not run" produce the same zero.
      - name: Lint and compare against the ratchet
        run: |
          npx eslint . --format json -o /tmp/eslint-report.json || true
          node scripts/check-eslint-ratchet.mjs --report /tmp/eslint-report.json

  cadence-lint:
    name: Cadence lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Flow CLI
        # The installer is fetched over the network; a transient reset (curl 35
        # "Connection reset by peer", seen on main 2026-07-31) previously left
        # `flow` uninstalled while the `sh -ci "$(curl …)"` wrapper still exited 0
        # (empty command string → no-op success), so the NEXT step failed with a
        # confusing `flow: command not found` (exit 127). Retry the fetch with
        # backoff, and verify `flow` is actually on PATH so a real install
        # failure fails HERE, loudly, instead of masquerading downstream.
        #
        # 🚨 GITHUB_TOKEN added 2026-08-27, and it is NOT about the fetch above —
        # it fixes a failure the retry loop is STRUCTURALLY UNABLE to help with.
        #
        # Two CI runs failed this step that night. The log shows all SEVEN
        # attempts failing ~65ms in, each at "Getting version of latest stable
        # release ..." — i.e. not a download at all. install.sh resolves "latest"
        # via `curl "https://api.github.com/repos/onflow/flow-cli/releases/latest"`,
        # which is UNAUTHENTICATED at 60 req/hr shared across the whole runner
        # IP pool. Once that limit is hit, more retries cannot clear it: the
        # loop's entire budget is ~168s and the rate-limit window is an hour.
        # ⭐ A retry loop only helps a TRANSIENT failure; it converts a
        # deterministic one into a slower deterministic one.
        #
        # install.sh reads GITHUB_TOKEN and sends it as an auth header (and falls
        # back to unauthenticated on a 403, so this cannot make things worse).
        # `secrets.GITHUB_TOKEN` is minted automatically per run — no new secret —
        # and raises the limit to 1,000/hr scoped to this repo rather than 60/hr
        # shared with every other project on the runner.
        #
        # ⓘ The alternative is pinning a version (install.sh takes it as arg 1 and
        # then skips the API call entirely). Deliberately NOT done: it would stop
        # these jobs testing against the Flow CLI users actually get, trading a
        # CI-reliability problem for a coverage one.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7; do
            if sh -ci "$(curl -fsSL --retry 3 --retry-connrefused --connect-timeout 10 https://raw.githubusercontent.com/onflow/flow-cli/master/install.sh)" && command -v flow >/dev/null 2>&1; then
              break
            fi
            # A transient GitHub-raw/CDN reset can outlast a short budget (seen
            # 2026-07-31: a ~50s window failed a 4x/30s retry; again 2026-08-09,
            # a ~169s window that reddened main on an unrelated insights commit).
            #
            # The loop used to run 6 attempts and then SLEEP 48s before giving up,
            # so it spent 168s of wall time to buy only 120s of real coverage —
            # the last 48s bought nothing. The 7th attempt fires after that final
            # sleep instead: same worst-case duration, coverage 120s -> 168s.
            # DO NOT re-add a trailing sleep — the last iteration must be an
            # ATTEMPT, not a wait. (Use `if`, not `[ … ] && break`: under
            # `set -e` a false test as the last statement in the loop body can
            # take the whole step down.)
            if [ "$attempt" -eq 7 ]; then break; fi
            echo "flow-cli install attempt $attempt failed; retrying in $((attempt * 8))s"
            export PATH="$HOME/.local/bin:$PATH"
            sleep $((attempt * 8))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v flow >/dev/null 2>&1 || { echo "::error::Flow CLI failed to install after retries"; exit 1; }
      # Populates the gitignored imports/ directory with the mainnet contract
      # sources (NFTStorefrontV2, FungibleToken, NonFungibleToken,
      # MetadataViews, ViewResolver) declared in flow.test.json. Without this,
      # `flow cadence lint` fails on unresolved imports instead of cleanly
      # surfacing the C1/C2 semantic errors. See docs/cadence-testing.md.
      - name: Install Cadence test dependencies
        run: flow dependencies install -f tests/cadence/flow.test.json -y
      - run: npm run test:cadence

  # RPCTradeEscrow contract test suite (cadence/tests/, 16 tests via
  # `flow test`) — first green 2026-07-17 after the two remaining test TODOs
  # (type-mismatch, receiver-cap invalidation) were implemented. Uses the
  # committed secrets-free config cadence/tests/flow.test.json; the
  # gitignored cadence/contracts/imports/ cache is populated by
  # scripts/fetch-cadence-escrow-test-deps.sh (ExampleNFT pinned to
  # flow-nft lib/go/contracts/v1.2.2 — master's needs EVM contracts absent
  # from the test env). The contract is UNDEPLOYED (Trade Hub shelved), so
  # this gates regressions in the escrow's audited security properties, not
  # a live surface. Confirmed green in Actions on its first run (2026-07-17,
  # run 29584112221 job 87896690125, flow-test step success in 30s) — now a
  # true BLOCKING gate, same promotion path cadence-lint followed. Revert:
  # re-add `continue-on-error: true`.
  cadence-escrow-tests:
    name: Cadence escrow tests (flow test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Flow CLI
        # See the cadence-lint job above: retry the network fetch and verify the
        # binary landed so a transient reset fails here instead of downstream.
        #
        # ⚠ GITHUB_TOKEN is required here for the SAME reason as that job, and
        # both copies must carry it — this is the job that actually went red on
        # 2026-08-27 (twice), on the unauthenticated GitHub API rate limit during
        # "Getting version of latest stable release", which no retry can clear.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7; do
            if sh -ci "$(curl -fsSL --retry 3 --retry-connrefused --connect-timeout 10 https://raw.githubusercontent.com/onflow/flow-cli/master/install.sh)" && command -v flow >/dev/null 2>&1; then
              break
            fi
            # A transient GitHub-raw/CDN reset can outlast a short budget (seen
            # 2026-07-31: a ~50s window failed a 4x/30s retry; again 2026-08-09,
            # a ~169s window that reddened main on an unrelated insights commit).
            #
            # The loop used to run 6 attempts and then SLEEP 48s before giving up,
            # so it spent 168s of wall time to buy only 120s of real coverage —
            # the last 48s bought nothing. The 7th attempt fires after that final
            # sleep instead: same worst-case duration, coverage 120s -> 168s.
            # DO NOT re-add a trailing sleep — the last iteration must be an
            # ATTEMPT, not a wait. (Use `if`, not `[ … ] && break`: under
            # `set -e` a false test as the last statement in the loop body can
            # take the whole step down.)
            if [ "$attempt" -eq 7 ]; then break; fi
            echo "flow-cli install attempt $attempt failed; retrying in $((attempt * 8))s"
            export PATH="$HOME/.local/bin:$PATH"
            sleep $((attempt * 8))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v flow >/dev/null 2>&1 || { echo "::error::Flow CLI failed to install after retries"; exit 1; }
      - name: Fetch test contract dependencies
        run: bash scripts/fetch-cadence-escrow-test-deps.sh
      - name: Run RPCTradeEscrow test suite
        run: flow test -f cadence/tests/flow.test.json cadence/tests/RPCTradeEscrow_test.cdc

  # Vitest unit suites (__tests__/**). Previously the suites existed but nothing
  # ran them in CI — a break in the FMV engine, the pack-EV math, the slug↔DB
  # bridge, the fast-break optimizer, or the edition hydrator merged green.
  # This job is a BLOCKING gate so those pure-logic invariants stay pinned.
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Run WITH coverage so the thresholds in vitest.config.ts (the ratchet)
      # gate the build: a drop below the current baseline fails CI. Covers the
      # same __tests__/** suites `npm test` runs, plus the coverage assertion.
      - run: npm run test:coverage

  # SECOND coverage gate — the React component layer, which the primary
  # unit-tests job (lib/** + app/api/**/route.ts only) does NOT measure. Runs
  # the jsdom __tests__/**/*.test.tsx suites against vitest.components.config.ts,
  # whose scoped `include` + own thresholds ratchet the logic-bearing component
  # subtrees so their coverage can only go UP (a drop fails CI). Kept a separate
  # job so a component-coverage dip doesn't muddy the primary ratchet's signal.
  component-tests:
    name: Component coverage (vitest jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage:components

  # Cloudflare Worker coverage. `workers/**` is 6,129 LOC of production ingest
  # and proxy code that neither of the two gates above measures — the primary
  # gate stops at lib/** + app/**/route.ts(x), the component gate at
  # components/** + *Client.tsx.
  #
  # ⚠ Unlike the page.tsx blind spot, this code was already WELL TESTED (22
  # suites, 21 of them importing the worker source and driving its fetch() /
  # scheduled() handlers). What it lacked was a floor, so that coverage could rot
  # silently — and the first anyone would learn of it is an ingest pipeline going
  # quiet. This job adds no tests; it stops the existing ones from eroding.
  #
  # Stakes: pack-events-ingest owns `event_kind`, which the
  # pack_purchases_set_is_primary_drop trigger reads to derive `is_primary_drop`,
  # so a regression there misclassifies primary drops as secondary sales across
  # every pack surface — a wrong number, not an error.
  worker-tests:
    name: Worker coverage (Cloudflare workers/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage:workers

  # Worker TYPE-check. The root tsconfig EXCLUDES `workers` and the worker
  # coverage job above runs vitest, which strips types with esbuild and never
  # checks them — so until 2026-09-02 the worker tree was type-checked by
  # NOTHING in CI, the same gap the edge functions had until edge-deno landed.
  # Each worker dir with a tsconfig is checked against the ROOT node_modules
  # (the worker package.jsons have no lockfile, so `npm ci` there is not
  # reproducible); @cloudflare/workers-types is a root devDependency for this.
  # ⚠ The count is asserted so a walk that matches nothing cannot pass.
  workers-typecheck:
    name: Worker typecheck (tsc per workers/*/tsconfig.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: tsc --noEmit in every worker that has a tsconfig
        run: |
          set -uo pipefail
          checked=0
          failed=0
          for cfg in workers/*/tsconfig.json; do
            [ -f "$cfg" ] || continue
            dir=$(dirname "$cfg")
            checked=$((checked + 1))
            echo "::group::tsc $dir"
            if npx tsc --noEmit -p "$dir"; then
              echo "ok  $dir"
            else
              echo "::error::type errors in $dir"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "worker tsconfigs checked: $checked, failed: $failed"
          if [ "$checked" -lt 3 ]; then
            echo "::error::expected at least 3 worker tsconfigs (3 on 2026-09-02), found $checked — the walk is wrong, not the tree clean."
            exit 1
          fi
          [ "$failed" -eq 0 ]

  # DB-invariant tests (supabase/tests/*.sql). Each test file is self-contained —
  # it creates minimal fixtures + a VERBATIM copy of the committed function DDL,
  # asserts the invariant, and ROLLBACKs — so no full-schema apply is needed (the
  # repo's migrations are incremental patches over a base created outside the repo
  # and don't rebuild it from scratch). The embedded DDL can't silently drift: the
  # BLOCKING unit-tests job runs __tests__/db-invariants-drift-guard.test.ts, which
  # fails if a copy diverges from its migration.
  #
  # We provision a throwaway Postgres from the runner's PREINSTALLED binaries
  # (initdb + pg_ctl) rather than a `services:` container — the Docker image pull
  # for a service container hangs in this environment. This is the same trust-auth
  # local-cluster approach validated locally. Port 5433 avoids the runner's own
  # preinstalled server on 5432; -k points the socket at a writable dir.
  # PROMOTED to a BLOCKING gate 2026-07-19 after a confirmed green Actions run
  # (run 29693477881: provision + all 3 SQL invariants passed), matching the
  # cadence-lint / cadence-escrow-tests promotion path. Revert to non-blocking:
  # re-add `continue-on-error: true`.
  db-tests:
    name: DB invariants (SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Provision a throwaway Postgres from the runner's binaries
        run: |
          set -euo pipefail
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "using $PGBIN"
          export PGDATA="$RUNNER_TEMP/pgdata"
          "$PGBIN/initdb" -D "$PGDATA" -U postgres --auth=trust
          # -k points the unix socket at a writable dir; the default (/var/run/
          # postgresql) is not writable by the non-root runner user, which is why
          # a bare start fails. We still connect over TCP localhost:5433.
          "$PGBIN/pg_ctl" -D "$PGDATA" -o "-p 5433 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start \
            || { echo '--- postgres server log ---'; cat "$RUNNER_TEMP/pg.log" || true; exit 1; }
          "$PGBIN/pg_isready" -h localhost -p 5433
      - name: Run DB-invariant tests
        env:
          DATABASE_URL: postgres://postgres@localhost:5433/postgres
        run: bash scripts/run-db-tests.sh

  # Ledger no-clobber guard (added 2026-07-19 after a real incident).
  # docs/overnight/ledger.md is append-at-top and MULTIPLE sessions write it
  # concurrently. On 2026-07-19 commit fecda2e silently deleted 13 entries
  # (353 -> 340 entries; 3,298 -> 3,184 lines) *while adding* its own entry, so
  # it looked like normal growth — destroying revert paths for live prod
  # migrations, including Claude Code's own candy_offers entry.
  # Root cause: writing back a whole copy of the file read earlier in the session.
  # The entry count is a mechanically checkable invariant, so check it: a DROP is
  # a clobber until proven otherwise. Legitimate archival rolls (the biweekly
  # rpc-context-hygiene pass) opt out with [ledger-roll] in the commit message.
  ledger-guard:
    name: Ledger no-clobber guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fail if ledger entries were deleted
        run: |
          LEDGER=docs/overnight/ledger.md
          if [ ! -f "$LEDGER" ]; then echo "no ledger file — skip"; exit 0; fi
          # It tests an absolute property of the file and needs no parent commit.
          # the ledger — which is how it first shipped, green and never executed.
          # Below it the check is VACUOUS on any push whose TIP commit does not touch
          # ⚠ THIS CHECK SITS ABOVE THE "ledger unchanged" EARLY EXIT ON PURPOSE.
          # A heading can also be stamped in a day that HAS NOT HAPPENED YET. The
          # ledger is dated PACIFIC, but CI, the cloud sandbox and the nightly pass
          # all run on UTC — which after 17:00 PT is already tomorrow. FOUR entries
          # were mis-stamped this way inside 35 minutes on 2026-08-17 (4b32934,
          # a18c39a, b7ec40b, 2892f29), while the warning was already sitting in
          # BOTH the ledger header and CLAUDE.md. The warning was not the fix.
          # ⚠ BAN AT POPULATION ZERO — those four were corrected, so any hit is new.
          # ⚠ The detector does its OWN UTC->PT conversion, and must. A check that
          # asks THIS runner for "today" computes the same wrong date the bug did,
          # so the mis-stamped entry looks like today's and the guard passes —
          # reproducing the exact defect it exists to catch.
          FUTD=scripts/find-future-dated-ledger-headings.mjs
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node unavailable, so the future-date ledger guard cannot run. Failing rather than skipping: a guard that silently no-ops is indistinguishable from a passing one."
            exit 1
          fi
          FD=$(node "$FUTD" "$LEDGER")
          echo "future-dated headings: ${FD:-0}"
          if [ "${FD:-0}" -gt 0 ]; then
            echo "::error file=docs/overnight/ledger.md::${FD} ledger heading(s) are dated in a day that has not happened in PACIFIC time."
            node "$FUTD" --show "$LEDGER"
            echo "::error::FIX: the ledger is dated PT, not UTC. After 17:00 PT the UTC clock is already on tomorrow, so a date -u stamp writes the wrong day. Take the date from PowerShell Get-Date (it prints the offset, so it cannot be wrong silently) or an explicit America/Los_Angeles conversion, correct the heading, re-push."
            exit 1
          fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then echo "no parent commit — skip"; exit 0; fi
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- "$LEDGER")" ]; then
            echo "ledger unchanged in this push — nothing to check"; exit 0
          fi
          # Compare heading SETS, not just counts. A count check alone has a blind spot:
          # a commit that REMOVES one entry and ADDS one keeps the count identical and
          # sails through. That is not hypothetical — commit 2966c0a did exactly that on
          # 2026-07-19 (356 -> 356) while destroying an entry holding revert paths for two
          # live prod views. Set comparison catches the swap; counts never could.
          # ⚠ THE LOST SET IS COMPUTED BY A DETECTOR, NOT BY `comm`, AND THAT IS A FIX.
          # A bare set difference reported the ONE repair the future-date arm above
          # DEMANDS: correcting a heading's date removes one heading string and adds
          # another, so the count holds and the set moves. Measured 2026-08-22/23 —
          # 0fa5388b failed the future-date arm, and 2d082db1, the correction it
          # demanded, failed THIS arm. The guard punished compliance, and the only
          # escapes were mislabelling the commit [ledger-roll] or leaving main red.
          # scripts/find-clobbered-ledger-headings.mjs exempts a heading whose BODY
          # (the text after the date) reappears in the after-file, and nothing else:
          # a delete, a remove-one/add-one swap and a re-WORDED heading are all still
          # reported. Its header carries the full reasoning.
          git show HEAD~1:"$LEDGER" > /tmp/led_before_full 2>/dev/null || : > /tmp/led_before_full
          cp "$LEDGER" /tmp/led_after_full
          grep '^### ' /tmp/led_before_full | sort -u > /tmp/led_before || true
          grep '^### ' /tmp/led_after_full | sort -u > /tmp/led_after || true
          CLOB=$(node scripts/find-clobbered-ledger-headings.mjs /tmp/led_before_full /tmp/led_after_full) || CLOB=""
          if [ -z "$CLOB" ]; then
            echo "::error::the ledger clobber detector produced no output, so it did not run. Failing rather than skipping: a guard that silently no-ops is indistinguishable from a passing one."
            exit 1
          fi
          GONE=""
          if [ "$CLOB" -gt 0 ]; then
            GONE=$(node scripts/find-clobbered-ledger-headings.mjs --show /tmp/led_before_full /tmp/led_after_full) || GONE="(detector failed to list them)"
          fi
          BEFORE=$(wc -l < /tmp/led_before | tr -d ' ')
          AFTER=$(wc -l < /tmp/led_after | tr -d ' ')
          echo "ledger entries: $BEFORE -> $AFTER"
          # A heading can be DESTROYED rather than deleted, and the set comparison
          # above is structurally blind to it. A write that splices on the substring
          # "### " instead of a line-start "^### " lands MID-SENTENCE: the new entry's
          # heading is swallowed into prose (so it is in neither /tmp/led_* list) and
          # the host sentence's tail becomes a bogus heading. Nothing is removed and
          # the COUNT GOES UP, so both existing checks pass while the file is damaged.
          # Happened 2026-08-13 (697dd86b), which cut this file's own clock-trap header
          # in half by splicing on the `### <date>` the header quotes as an example.
          # Three earlier instances from 2026-08-11 are still live in the file and are
          # NOT repaired here — hence a DELTA check, not an absolute one: pre-existing
          # damage must not red every unrelated push, but a NEW one fails immediately.
          # ⚠ The obvious spelling of this check does NOT work — see the header of
          # scripts/find-swallowed-ledger-headings.awk, which holds the detector and
          # the reason ("not preceded by a backtick" misses the very incident that
          # motivated it).
          SWALL=scripts/find-swallowed-ledger-headings.awk
          SW_BEFORE=$(git show HEAD~1:"$LEDGER" 2>/dev/null | awk -f "$SWALL")
          SW_AFTER=$(awk -f "$SWALL" "$LEDGER")
          echo "swallowed headings: ${SW_BEFORE:-0} -> ${SW_AFTER:-0}"
          if [ "${SW_AFTER:-0}" -gt "${SW_BEFORE:-0}" ]; then
            echo "::error file=docs/overnight/ledger.md::A ledger heading was SWALLOWED INTO PROSE (${SW_BEFORE} -> ${SW_AFTER}). Your entry spliced on the substring '### ' and landed mid-sentence, so it has no '^### ' heading of its own and the host line was cut in half."
            awk -v show=1 -f "$SWALL" "$LEDGER"
            echo "::error::FIX: splice at the first line whose FIRST CHARACTERS are '### ' (a line-start anchor), never at a substring match. Re-read the file from disk, put your heading on its own line, re-push."
            exit 1
          fi
          if [ -n "$GONE" ]; then
            if git log -1 --pretty=%B | grep -qF '[ledger-roll]'; then
              echo "Removal allowed — commit tagged [ledger-roll] (archival roll)."
              exit 0
            fi
            echo "::error file=docs/overnight/ledger.md::Ledger entries DISAPPEARED. These headings existed in HEAD~1 and are gone in HEAD:"
            echo "$GONE"
            echo "::error::This is the concurrent-session clobber: you wrote back a copy of the ledger read earlier in the session, destroying entries (and revert paths) committed in between. FIX: git show HEAD~1:docs/overnight/ledger.md, splice your entry into the CURRENT file, re-push. If intentional (archival roll), put [ledger-roll] in the commit message."
            exit 1
          fi
          if [ "$AFTER" -lt "$BEFORE" ]; then
            if git log -1 --pretty=%B | grep -qF '[ledger-roll]'; then
              echo "Decrease allowed — commit tagged [ledger-roll] (archival roll)."
              exit 0
            fi
            echo "::error file=docs/overnight/ledger.md::Ledger entries DROPPED ${BEFORE} -> ${AFTER}. This is almost certainly the concurrent-session clobber: you wrote back a copy of the ledger read earlier in the session, destroying entries (and revert paths) committed in between. FIX: git show HEAD~1:docs/overnight/ledger.md, splice your entry into the CURRENT file, re-push. If this deletion is intentional (archival roll), put [ledger-roll] in the commit message."
            exit 1
          fi
          echo "OK — no entries lost."

  # Register integrity guard — ADDED 2026-08-29. docs/audits/deep-audit-register.md
  # is the canonical open list, and it was the only one of the three coordination
  # files with no guard: the ledger has the no-clobber + future-date arms above,
  # docs/overnight/inbox/INDEX.md has four CI assertions, and the register had
  # NOTHING. A row deleted by a bad splice un-files a finding — worse than losing
  # a history entry, because the next pass never looks again.
  #
  # ⚠ It found four real defects on its first full run (R26, R31, D30, R46), all
  # of the same shape: a row that renders in the WRONG columns. GFM splits a table
  # row on `|` BEFORE it parses inline code, so a raw pipe inside backticks —
  # `/(ts|tsx)/`, `(TierBreakdownCard|PortfolioSparkline)` — opens a column, and
  # cells past the header's width are DISCARDED by the renderer. R46's `owner`
  # column had simply vanished from the rendered table. A grep still finds every
  # character of it, which is why nobody had noticed.
  #
  # ⚠ The no-clobber arm needs the parent revision, so this job carries
  # fetch-depth: 2 and runs on push only, exactly like ledger-guard. The shape
  # arm is absolute and is covered on every event by
  # __tests__/register-integrity-guard.test.ts in the main suite — so a PR is not
  # unguarded, it is only un-compared.
  register-guard:
    name: Register integrity guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fail if a register row was dropped or malformed
        run: |
          REGISTER=docs/audits/deep-audit-register.md
          if [ ! -f "$REGISTER" ]; then
            echo "::error::$REGISTER is missing. The canonical open list cannot be checked."
            exit 1
          fi
          # ⚠ Every `run:` block is `bash -e`, so a fallible command in an
          # ASSIGNMENT aborts the step there. Written `X=$(…) || X=""` so the
          # explicit test below is what decides, not the assignment's exit status.
          BEFORE=/tmp/register_before.md
          git show HEAD~1:"$REGISTER" > "$BEFORE" 2>/dev/null || : > "$BEFORE"
          if [ -s "$BEFORE" ]; then
            node scripts/check-register-integrity.mjs --before "$BEFORE"
          else
            # No parent revision (first commit, shallow history): the shape arm
            # still runs. It is NOT skipped — a guard that no-ops on a missing
            # parent is indistinguishable from a passing one.
            echo "no parent revision for $REGISTER — running the shape arm only"
            node scripts/check-register-integrity.mjs
          fi

  # Inbox no-clobber guard — ADDED 2026-09-03 after a real incident THIS repo's
  # three existing inbox guards could not have caught.
  #
  # Two sessions edited one filing twenty minutes apart. The second rewrote it in
  # place from a copy read before the first landed, silently deleting an 84-line
  # `## \u26d4 CORRECTION` block — the block refuting the filing's headline number.
  # A human reading the diff caught it (4ed563071 destroyed it, 2f1263240 restored
  # it); nothing in CI moved.
  #
  # \U0001f6a8 ALL THREE EXISTING INBOX GUARDS PASSED AND NONE COULD HAVE FAILED.
  # `inbox-index-lists-every-filing`, `fix-inbox-index-counts` and
  # `inbox-is-append-only-since-the-rule` ask WHICH filings exist and HOW MANY. A
  # rewrite that keeps the file keeps the count. That is the ledger's own 2026-07
  # lesson — "diff the SET, not the count" (2966c0a, 356 -> 356 while destroying
  # two revert paths) — sitting unlearned one directory over.
  #
  # \u2b50 THE DETECTOR TOOK THREE DESIGNS AND THE TWO FAILURES ARE THE POINT.
  # v1 ("every `## ` heading before must exist after") caught the incident and then
  # FALSE-POSITIVED on the repair, because the repairing session renamed two
  # sections while merging — the same shape that made the LEDGER guard punish
  # compliance on 2026-08-22/23. v2 ("the after-file must still hold SOME
  # correction heading") MISSED the incident, because the clobbering commit added
  # its own correction while deleting the other: 1 -> 1. The count-blindness lesson
  # reproduced inside the guard written about count-blindness.
  # v3 keys on CONTENT — a correction's longest body lines must still appear
  # somewhere in the after-file. Renaming and moving are free; deletion is not.
  #
  # \u26a0 CORRECTIONS ONLY, deliberately. They are the highest-value, lowest-churn
  # content in a filing (they exist because someone acted on a wrong number) and
  # "the correction vanished" has no legitimate cause. Everything else in a filing
  # stays free to be rewritten, so this guard has no reason to be disabled.
  #
  # \u26a0 The comparison needs the parent revision, so this job carries
  # fetch-depth: 2 and runs on push only, exactly like ledger-guard. The
  # DETECTOR ITSELF is pinned on every event by
  # __tests__/inbox-corrections-cannot-be-silently-clobbered.test.ts, whose cases
  # are built from the real before/after text of the incident — so a PR is not
  # unguarded, it is only un-compared.
  inbox-guard:
    name: Inbox no-clobber guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fail if an inbox correction was deleted
        run: |
          DETECT=scripts/find-clobbered-inbox-corrections.mjs
          if [ ! -f "$DETECT" ]; then
            echo "::error::$DETECT is missing, so the inbox clobber guard cannot run. Failing rather than skipping: a guard that silently no-ops is indistinguishable from a passing one."
            exit 1
          fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then echo "no parent commit — skip"; exit 0; fi
          # \u26a0 Every `run:` block is `bash -e`, so a fallible command in an
          # ASSIGNMENT aborts the step there. Written `X=$(…) || X=""` so the
          # explicit test below decides, not the assignment's exit status.
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'docs/overnight/inbox/*.md' ':!docs/overnight/inbox/archive/**') || CHANGED=""
          if [ -z "$CHANGED" ]; then
            echo "no inbox filing changed in this push — nothing to compare"; exit 0
          fi
          # \u26a0 ASSERT THE COUNT INSPECTED. A walk that silently matched nothing
          # exits 0 and reads exactly like a clean repo.
          echo "inbox filings changed in this push:"
          echo "$CHANGED"
          INSPECTED=0
          FAILED=0
          REMOVED=0
          CLOBBERED=0
          # Via a FILE, not a pipe: a `... | while` runs the loop in a SUBSHELL, so
          # every counter it increments is discarded at the `done` and the step
          # reports "inspected: 0 / failed: 0" no matter what it found.
          printf '%s\n' "$CHANGED" > /tmp/inbox_changed.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            git show "HEAD~1:$f" > /tmp/inbox_before.md 2>/dev/null || : > /tmp/inbox_before.md
            # A filing DELETED or MOVED by this push has no after-file, so every
            # correction it held is gone. That IS the property this guard exists to
            # protect, and it is reported — but with its own message, because the
            # fix ("splice into the current file") makes no sense for a removal and
            # a wrong remedy in an error is worse than none.
            if [ ! -f "$f" ]; then
              REMOVED=$((REMOVED + 1))
              LOST_R=$(node "$DETECT" /tmp/inbox_before.md /dev/null) || LOST_R="0"
              if [ "${LOST_R:-0}" -gt 0 ]; then
                FAILED=$((FAILED + 1))
                echo "::error file=$f::This filing was REMOVED and carried ${LOST_R} correction block(s). docs/overnight/inbox/ is APPEND-ONLY since 2026-08-17 (see docs/overnight/focus.md and __tests__/inbox-is-append-only-since-the-rule.test.ts) — filings are permanent citation targets, referenced by path from CLAUDE.md, the ledger, committed migrations and live product source. Restore the file."
              fi
              INSPECTED=$((INSPECTED + 1))
              continue
            fi
            cp "$f" /tmp/inbox_after.md
            LOST=$(node "$DETECT" /tmp/inbox_before.md /tmp/inbox_after.md) || LOST=""
            if [ -z "$LOST" ]; then
              echo "::error::the inbox clobber detector produced no output for $f, so it did not run. Failing rather than skipping: a guard that silently no-ops is indistinguishable from a passing one."
              exit 1
            fi
            INSPECTED=$((INSPECTED + 1))
            if [ "$LOST" -gt 0 ]; then
              FAILED=$((FAILED + 1))
              CLOBBERED=$((CLOBBERED + 1))
              echo "::error file=$f::${LOST} correction block(s) present in HEAD~1 are GONE in HEAD. The text below no longer appears anywhere in the file:"
              node "$DETECT" --show /tmp/inbox_before.md /tmp/inbox_after.md || echo "(detector failed to list them)"
            fi
          done < /tmp/inbox_changed.txt
          echo "inbox filings removed in this push: $REMOVED"
          echo "inbox filings inspected: $INSPECTED"
          if [ "$INSPECTED" -eq 0 ]; then
            echo "::error::inbox filings changed but none were inspected — the walk is wrong, not the repo clean."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            if git log -1 --pretty=%B | grep -qF '[inbox-correction-retracted]'; then
              echo "Removal allowed — commit tagged [inbox-correction-retracted]."
              exit 0
            fi
            # \u26a0 The remedy is printed only for the failure it fits. A REMOVED
            # filing cannot be repaired by "splice into the current file", and an
            # error carrying a remedy that does not work is worse than one carrying
            # none — the reader tries it, it fails, and the guard loses its
            # authority.
            if [ "$CLOBBERED" -gt 0 ]; then
              echo "::error::This is the concurrent-session clobber: you wrote back a copy of the filing read earlier in the session, destroying a correction committed in between. FIX: git show HEAD~1:<filing>, splice your edit into the CURRENT file, re-push. Renaming or moving a correction is fine — this only fires when the TEXT is gone. If a correction is genuinely being RETRACTED, put [inbox-correction-retracted] in the commit message."
            fi
            exit 1
          fi
          echo "OK — no corrections lost."

  # Deno type-check + lint for the Supabase edge functions (supabase/functions/**).
  # Those run on Deno and are excluded from the vitest/tsc coverage measure (no
  # Deno toolchain elsewhere in CI), so the edge SOURCE was previously
  # type-checked by NOTHING — a broken import or wrong signature only surfaced at
  # `supabase functions deploy`. `deno check` resolves the real remote imports
  # (jsr/esm/deno.land) that a dev-sandbox proxy blocks, so CI is the first place
  # the edge source is actually type-verified.
  #
  # The functions now use bare-specifier imports resolved by
  # supabase/functions/deno.json (an import map), landed 2026-07-30 to satisfy
  # newer Deno's no-import-prefix / no-unversioned-import rules. `deno check` is
  # the real gate (type + import resolution — catches broken imports / wrong
  # signatures in the edge source, which nothing else checks).
  #
  # PROMOTED TO BLOCKING 2026-08-01 (16 errors -> 0). The long-standing 16 were
  # NOT a toolchain conflict and NOT edge-source import bugs, which is what the
  # 2026-07-31 diagnosis recorded here. They were an INVOCATION BUG in this job:
  # there is no deno.json at the repo root, and these steps run from the repo
  # root, so Deno never discovered supabase/functions/deno.json and the import
  # map was simply never applied. Adding `--config supabase/functions/deno.json`
  # takes the count 16 -> 2 on the spot (all 12 "@supabase/functions-js/
  # edge-runtime.d.ts not a dependency" + both "std/http/server.ts not a
  # dependency" clear). Adjudicated locally on Deno 2.9.4, which the blind cloud
  # sandbox could not do.
  #
  # Corrections to the prior comment, each re-tested: --node-modules-dir=auto is
  # NOT load-bearing for resolution (dropping it does not hard-fail; it only
  # changes the 12 messages from "not a dependency" to "Cannot find module"), and
  # the 2 TS7022 were NOT cascades from the SDK types failing to load — they
  # survive a fully-resolved graph and are a genuine inference limit in Deno's
  # bundled TypeScript 6.x on the paginating fetchAllEditions loop, fixed by two
  # type-erased annotations in compute-topshot-pack-ev/index.ts.
  #
  # Consequently the fix this comment used to prescribe — remap the SDK subpath
  # to npm: and replace the 2 std/http `serve` imports with Deno.serve — was
  # based on the wrong root cause and is NOT needed. It was deploy-affecting
  # churn against a repo↔deployed divergence that already exists; do not
  # resurrect it. See docs/archive/handoffs/handoff-2026-07-30-deno-edge-ci.md (now superseded on
  # this point).
  #
  # deno lint auto-discovers supabase/functions/deno.json (excludes the
  # deliberate no-explicit-any). The import-map refactor cleared ~60 import-style
  # findings; the ~15 residual style findings (require-await, no-unused-vars,
  # no-empty, no-inner-declarations) are pre-existing and low-value, so lint is
  # informational (|| true) and never gates.
  # Tree-corruption guard — WIRED 2026-08-18, having previously been wired to
  # NOTHING. scripts/check-tree-corruption.mjs guards the documented
  # Windows<->sandbox mount failure (NUL injection, mid-file truncation). Its own
  # header says "wire it as a pre-commit hook"; measured 2026-08-18, nobody had:
  # no CI job, no .husky, no core.hooksPath, no .git/hooks/pre-commit, and its
  # only caller was the manual scripts/clean-tree.mjs. An unreachable monitor and
  # a green build look identical.
  #
  # ⚠ --all IS LOAD-BEARING. The default mode inspects STAGED content, and on a
  # CI checkout nothing is staged, so it prints "0 file(s) checked, clean" and
  # exits 0 forever — a job that passes by inspecting nothing. The file count is
  # therefore asserted below rather than trusted.
  #
  # ⚠ It earned its place on first run: over the whole tree it found a real hit,
  # a literal NUL byte committed inside lib/concierge/rich-text.ts's
  # control-character URL filter (fixed in the same commit that added this job).
  tree-corruption:
    name: Tree corruption (NUL / truncation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit every tracked file for NUL bytes and truncation
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node unavailable, so the corruption guard cannot run. Failing rather than skipping: a guard that silently no-ops is indistinguishable from a passing one."
            exit 1
          fi
          set -o pipefail
          node scripts/check-tree-corruption.mjs --all | tee /tmp/corruption.out
          # Non-vacuity: the guard reports how many files it inspected, and the
          # number is the whole difference between this job working and this job
          # being theatre. 1000 is far below the ~4,700 tracked today and far
          # above the 0 the staged mode would report.
          COUNT=$(sed -n 's/.*guard: \([0-9]\+\) file(s) checked.*/\1/p' /tmp/corruption.out)
          echo "files inspected: ${COUNT:-unknown}"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1000 ]; then
            echo "::error::The corruption guard reported ${COUNT:-no} inspected files. That is the vacuous-pass shape (staged mode on a clean checkout reports 0) — it did not audit the tree."
            exit 1
          fi

  edge-deno:
    name: Edge functions (deno check + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno version (diagnostic)
        run: deno --version
      # --config is LOAD-BEARING: these steps run from the repo root, there is no
      # deno.json there, so without it Deno never finds supabase/functions/deno.json
      # and every bare specifier in the import map goes unresolved. Do not drop it.
      - name: deno cache (populate module graph)
        run: deno cache --config supabase/functions/deno.json --unstable-sloppy-imports --node-modules-dir=auto supabase/functions/*/index.ts supabase/functions/_shared/*.ts || true
      # --unstable-sloppy-imports lets Deno resolve the extensionless "./cdc" the
      # _shared modules use (DUAL-CONSUMED by vitest/tsc, which reject an explicit
      # .ts extension) — this cleared the _shared "Cannot find module" error class.
      # --node-modules-dir=auto is retained for the SDK's transitive npm type deps;
      # it is not what makes the import map resolve (see the job header).
      - name: deno check (type + import resolution)
        run: deno check --config supabase/functions/deno.json --unstable-sloppy-imports --node-modules-dir=auto supabase/functions/*/index.ts supabase/functions/_shared/*.ts
      - name: deno lint (informational)
        if: always()
        run: deno lint supabase/functions/ || true
