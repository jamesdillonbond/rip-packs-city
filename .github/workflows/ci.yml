name: CI

# Audit 2026-05-20 (F6): nothing previously gated build / type-check before code
# reached main. This workflow blocks a broken build on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches package.json engines.node ("24.x") and @types/node ^24.
          # Previously '20' — Vercel deploys on Node 24 by default so the
          # build passed there, but tsc against @types/node v24 on Node 20
          # surfaces type errors in the CI lambda that production never sees.
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Brand-token regression guard — fails if a Phase-1-cleaned public surface
      # regrows a hardcoded #E03A2F / 'Barlow Condensed' / 'Share Tech Mono'
      # literal instead of the var(--rpc-*) tokens. Pure node, no deps.
      - run: node scripts/check-brand-tokens.mjs

  # Cadence type-check harness for the purchase-moment transaction (canonical
  # source: lib/chains/flow/cadence/purchase-moment.ts after the 2026-05-30
  # Phase-D reorg; lib/cadence/purchase-moment.ts is a re-export shim).
  # The C1/C2 compile errors that docs/cadence-testing.md once described are
  # fixed (FungibleToken is imported; self.listing is borrowed before its price
  # is read). Confirmed green locally on 2026-05-30: `npm run test:cadence`
  # exits 0 (0 errors, 2 allowed string-template warnings). This job is now a
  # true BLOCKING regression gate — any future type error in the production
  # transaction fails the build. Revert: re-add `continue-on-error: true`.
  cadence-lint:
    name: Cadence lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Flow CLI
        # The installer is fetched over the network; a transient reset (curl 35
        # "Connection reset by peer", seen on main 2026-07-31) previously left
        # `flow` uninstalled while the `sh -ci "$(curl …)"` wrapper still exited 0
        # (empty command string → no-op success), so the NEXT step failed with a
        # confusing `flow: command not found` (exit 127). Retry the fetch with
        # backoff, and verify `flow` is actually on PATH so a real install
        # failure fails HERE, loudly, instead of masquerading downstream.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if sh -ci "$(curl -fsSL https://raw.githubusercontent.com/onflow/flow-cli/master/install.sh)"; then
              break
            fi
            echo "flow-cli install attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v flow >/dev/null 2>&1 || { echo "::error::Flow CLI failed to install after retries"; exit 1; }
      # Populates the gitignored imports/ directory with the mainnet contract
      # sources (NFTStorefrontV2, FungibleToken, NonFungibleToken,
      # MetadataViews, ViewResolver) declared in flow.test.json. Without this,
      # `flow cadence lint` fails on unresolved imports instead of cleanly
      # surfacing the C1/C2 semantic errors. See docs/cadence-testing.md.
      - name: Install Cadence test dependencies
        run: flow dependencies install -f tests/cadence/flow.test.json -y
      - run: npm run test:cadence

  # RPCTradeEscrow contract test suite (cadence/tests/, 16 tests via
  # `flow test`) — first green 2026-07-17 after the two remaining test TODOs
  # (type-mismatch, receiver-cap invalidation) were implemented. Uses the
  # committed secrets-free config cadence/tests/flow.test.json; the
  # gitignored cadence/contracts/imports/ cache is populated by
  # scripts/fetch-cadence-escrow-test-deps.sh (ExampleNFT pinned to
  # flow-nft lib/go/contracts/v1.2.2 — master's needs EVM contracts absent
  # from the test env). The contract is UNDEPLOYED (Trade Hub shelved), so
  # this gates regressions in the escrow's audited security properties, not
  # a live surface. Confirmed green in Actions on its first run (2026-07-17,
  # run 29584112221 job 87896690125, flow-test step success in 30s) — now a
  # true BLOCKING gate, same promotion path cadence-lint followed. Revert:
  # re-add `continue-on-error: true`.
  cadence-escrow-tests:
    name: Cadence escrow tests (flow test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flow CLI
        # See the cadence-lint job above: retry the network fetch and verify the
        # binary landed so a transient reset fails here instead of downstream.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if sh -ci "$(curl -fsSL https://raw.githubusercontent.com/onflow/flow-cli/master/install.sh)"; then
              break
            fi
            echo "flow-cli install attempt $attempt failed; retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v flow >/dev/null 2>&1 || { echo "::error::Flow CLI failed to install after retries"; exit 1; }
      - name: Fetch test contract dependencies
        run: bash scripts/fetch-cadence-escrow-test-deps.sh
      - name: Run RPCTradeEscrow test suite
        run: flow test -f cadence/tests/flow.test.json cadence/tests/RPCTradeEscrow_test.cdc

  # Vitest unit suites (__tests__/**). Previously the suites existed but nothing
  # ran them in CI — a break in the FMV engine, the pack-EV math, the slug↔DB
  # bridge, the fast-break optimizer, or the edition hydrator merged green.
  # This job is a BLOCKING gate so those pure-logic invariants stay pinned.
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Run WITH coverage so the thresholds in vitest.config.ts (the ratchet)
      # gate the build: a drop below the current baseline fails CI. Covers the
      # same __tests__/** suites `npm test` runs, plus the coverage assertion.
      - run: npm run test:coverage

  # SECOND coverage gate — the React component layer, which the primary
  # unit-tests job (lib/** + app/api/**/route.ts only) does NOT measure. Runs
  # the jsdom __tests__/**/*.test.tsx suites against vitest.components.config.ts,
  # whose scoped `include` + own thresholds ratchet the logic-bearing component
  # subtrees so their coverage can only go UP (a drop fails CI). Kept a separate
  # job so a component-coverage dip doesn't muddy the primary ratchet's signal.
  component-tests:
    name: Component coverage (vitest jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage:components

  # DB-invariant tests (supabase/tests/*.sql). Each test file is self-contained —
  # it creates minimal fixtures + a VERBATIM copy of the committed function DDL,
  # asserts the invariant, and ROLLBACKs — so no full-schema apply is needed (the
  # repo's migrations are incremental patches over a base created outside the repo
  # and don't rebuild it from scratch). The embedded DDL can't silently drift: the
  # BLOCKING unit-tests job runs __tests__/db-invariants-drift-guard.test.ts, which
  # fails if a copy diverges from its migration.
  #
  # We provision a throwaway Postgres from the runner's PREINSTALLED binaries
  # (initdb + pg_ctl) rather than a `services:` container — the Docker image pull
  # for a service container hangs in this environment. This is the same trust-auth
  # local-cluster approach validated locally. Port 5433 avoids the runner's own
  # preinstalled server on 5432; -k points the socket at a writable dir.
  # PROMOTED to a BLOCKING gate 2026-07-19 after a confirmed green Actions run
  # (run 29693477881: provision + all 3 SQL invariants passed), matching the
  # cadence-lint / cadence-escrow-tests promotion path. Revert to non-blocking:
  # re-add `continue-on-error: true`.
  db-tests:
    name: DB invariants (SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision a throwaway Postgres from the runner's binaries
        run: |
          set -euo pipefail
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "using $PGBIN"
          export PGDATA="$RUNNER_TEMP/pgdata"
          "$PGBIN/initdb" -D "$PGDATA" -U postgres --auth=trust
          # -k points the unix socket at a writable dir; the default (/var/run/
          # postgresql) is not writable by the non-root runner user, which is why
          # a bare start fails. We still connect over TCP localhost:5433.
          "$PGBIN/pg_ctl" -D "$PGDATA" -o "-p 5433 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start \
            || { echo '--- postgres server log ---'; cat "$RUNNER_TEMP/pg.log" || true; exit 1; }
          "$PGBIN/pg_isready" -h localhost -p 5433
      - name: Run DB-invariant tests
        env:
          DATABASE_URL: postgres://postgres@localhost:5433/postgres
        run: bash scripts/run-db-tests.sh

  # Ledger no-clobber guard (added 2026-07-19 after a real incident).
  # docs/overnight/ledger.md is append-at-top and MULTIPLE sessions write it
  # concurrently. On 2026-07-19 commit fecda2e silently deleted 13 entries
  # (353 -> 340 entries; 3,298 -> 3,184 lines) *while adding* its own entry, so
  # it looked like normal growth — destroying revert paths for live prod
  # migrations, including Claude Code's own candy_offers entry.
  # Root cause: writing back a whole copy of the file read earlier in the session.
  # The entry count is a mechanically checkable invariant, so check it: a DROP is
  # a clobber until proven otherwise. Legitimate archival rolls (the biweekly
  # rpc-context-hygiene pass) opt out with [ledger-roll] in the commit message.
  ledger-guard:
    name: Ledger no-clobber guard
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fail if ledger entries were deleted
        run: |
          LEDGER=docs/overnight/ledger.md
          if [ ! -f "$LEDGER" ]; then echo "no ledger file — skip"; exit 0; fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then echo "no parent commit — skip"; exit 0; fi
          if [ -z "$(git diff --name-only HEAD~1 HEAD -- "$LEDGER")" ]; then
            echo "ledger unchanged in this push — nothing to check"; exit 0
          fi
          # Compare heading SETS, not just counts. A count check alone has a blind spot:
          # a commit that REMOVES one entry and ADDS one keeps the count identical and
          # sails through. That is not hypothetical — commit 2966c0a did exactly that on
          # 2026-07-19 (356 -> 356) while destroying an entry holding revert paths for two
          # live prod views. Set comparison catches the swap; counts never could.
          git show HEAD~1:"$LEDGER" 2>/dev/null | grep '^### ' | sort -u > /tmp/led_before || true
          grep '^### ' "$LEDGER" | sort -u > /tmp/led_after || true
          GONE=$(comm -23 /tmp/led_before /tmp/led_after || true)
          BEFORE=$(wc -l < /tmp/led_before | tr -d ' ')
          AFTER=$(wc -l < /tmp/led_after | tr -d ' ')
          echo "ledger entries: $BEFORE -> $AFTER"
          if [ -n "$GONE" ]; then
            if git log -1 --pretty=%B | grep -qF '[ledger-roll]'; then
              echo "Removal allowed — commit tagged [ledger-roll] (archival roll)."
              exit 0
            fi
            echo "::error file=docs/overnight/ledger.md::Ledger entries DISAPPEARED. These headings existed in HEAD~1 and are gone in HEAD:"
            echo "$GONE"
            echo "::error::This is the concurrent-session clobber: you wrote back a copy of the ledger read earlier in the session, destroying entries (and revert paths) committed in between. FIX: git show HEAD~1:docs/overnight/ledger.md, splice your entry into the CURRENT file, re-push. If intentional (archival roll), put [ledger-roll] in the commit message."
            exit 1
          fi
          if [ "$AFTER" -lt "$BEFORE" ]; then
            if git log -1 --pretty=%B | grep -qF '[ledger-roll]'; then
              echo "Decrease allowed — commit tagged [ledger-roll] (archival roll)."
              exit 0
            fi
            echo "::error file=docs/overnight/ledger.md::Ledger entries DROPPED ${BEFORE} -> ${AFTER}. This is almost certainly the concurrent-session clobber: you wrote back a copy of the ledger read earlier in the session, destroying entries (and revert paths) committed in between. FIX: git show HEAD~1:docs/overnight/ledger.md, splice your entry into the CURRENT file, re-push. If this deletion is intentional (archival roll), put [ledger-roll] in the commit message."
            exit 1
          fi
          echo "OK — no entries lost."

  # Deno type-check + lint for the Supabase edge functions (supabase/functions/**).
  # Those run on Deno and are excluded from the vitest/tsc coverage measure (no
  # Deno toolchain elsewhere in CI), so the edge SOURCE was previously
  # type-checked by NOTHING — a broken import or wrong signature only surfaced at
  # `supabase functions deploy`. `deno check` resolves the real remote imports
  # (jsr/esm/deno.land) that a dev-sandbox proxy blocks, so CI is the first place
  # the edge source is actually type-verified.
  #
  # The functions now use bare-specifier imports resolved by
  # supabase/functions/deno.json (an import map), landed 2026-07-30 to satisfy
  # newer Deno's no-import-prefix / no-unversioned-import rules. `deno check` is
  # the real gate (type + import resolution — catches broken imports / wrong
  # signatures in the edge source, which nothing else checks). It STAYS
  # non-blocking (continue-on-error) only until a CI run confirms it is green
  # over our files; then drop `continue-on-error` to promote it to blocking (the
  # same path cadence-lint followed). --node-modules-dir=auto resolves the
  # Supabase SDK's transitive `npm:openai` type dep. See
  # docs/handoff-2026-07-30-deno-edge-ci.md for the deploy-verify step.
  #
  # deno lint auto-discovers supabase/functions/deno.json (excludes the
  # deliberate no-explicit-any). The import-map refactor cleared ~60 import-style
  # findings; the ~15 residual style findings (require-await, no-unused-vars,
  # no-empty, no-inner-declarations) are pre-existing and low-value, so lint is
  # informational (|| true) and never gates.
  edge-deno:
    name: Edge functions (deno check + lint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check (type + import resolution)
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts supabase/functions/_shared/*.ts
      - name: deno lint (informational)
        if: always()
        run: deno lint supabase/functions/ || true
