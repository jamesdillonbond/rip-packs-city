name: Cadence inline scripts type-check against mainnet

# 2026-11-15 (Trevor: "keep digging and probing"). Every inline Cadence SCRIPT the app runs
# (`fun main(` inside a template literal) is sent to mainnet's script endpoint with
# placeholder arguments; a TYPE error fails the job. A script that cannot type-check fails on
# every call, and its callers catch that per item, so the lane reports success while doing
# nothing: 10 of 108 such scripts had never type-checked when this was written
# (scripts/cadence/check-inline-scripts.mjs carries the cases and the method).
#
# Runs on any push touching code that can carry a script, weekly (deployed contracts we do
# not own can change under us; GitHub runs schedules late, which is fine for this), and on
# demand. No npm install: the checker is plain Node.

on:
  schedule:
    - cron: "17 16 * * 3"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "supabase/functions/**"
      - "scripts/**"
      - "workers/**"
      - ".github/workflows/cadence-inline-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Every inline Cadence script type-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Type-check inline Cadence scripts against mainnet
        run: node scripts/cadence/check-inline-scripts.mjs
# 2026-11-17: touched so GitHub re-registers this schedule after the 6:22 AM PT tree restore (ledger 11-17).
