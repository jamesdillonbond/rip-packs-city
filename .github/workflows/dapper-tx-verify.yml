name: Dapper tx verify (Dapper storefront + OffersV2 sales in Flowty's index)

# 2026-10-04. Flowty's storefrontEvents index also carries sales on Dapper's own contracts
# (NFTStorefrontV2 at 0x4eb8a10cb9f87357 — customID DAPPER_MARKETPLACE is the collection's own
# marketplace — and OffersV2 at 0xb8ea91944fd51c43). Rows that `sales` lacks (USD-pegged, TS/AD/GZ/UFC)
# are checked against their OWN transaction on the history node of their era, with buyer and seller
# read from the chain (the index's parties are wrong on these rows). Verdicts land via
# public.ingest_dapper_tx_verdicts (migration 20261004114808) with method 'tx_dapper';
# flowty_archive.promote_dapper_tx_verified_sales promotes them as source dapper_chain_tx_v1.
# Sharded by md5(doc_id); re-runnable (only rows without a verdict are read). workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      rps:
        description: "requests/second per shard"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: dapper-tx-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shard ${{ matrix.shard }}/6
        env:
          RPS: ${{ github.event.inputs.rps }}
          WORKERS: "16"
          MAX_MINUTES: "320"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::Supabase secrets not configured"; exit 2
          fi
          case "${RPS:-}" in (''|*[!0-9.]*) echo "rps must be a number"; exit 2;; esac
          python3 scripts/flowty-export/test_chain_walk_gha.py
          cd scripts/flowty-export
          python3 chain_verify_dapper_gha.py "${{ matrix.shard }}" 6
