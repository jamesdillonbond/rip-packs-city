name: Sales Indexers Backstop
# Ops-safety Item 4 (handoff 2026-06-27): the TopShot + AllDay on-chain sales
# indexers (pipeline_runs `topshot-sales-indexer` / `allday-sales-indexer`,
# both HIGH severity in pipeline_cadence_watchlist) are triggered ONLY by
# cron-job.org today. cron-job.org auto-disables a job that persistently fails
# its 30s client cap, so a single bad window can silently kill sales ingest
# (the 2026-05-31 topshot-sales-indexer 01:32-08:02 UTC outage). This workflow
# is a REDUNDANT BACKSTOP, not a replacement: both routes are fire-and-forget
# (return 202/200, work runs in after()) and idempotent (block-cursor +
# transaction_hash dedup), so firing them again from GHA is safe — a duplicate
# tick advances the cursor or no-ops. Scheduled twice hourly. Minutes :18/:48
# are GHA-empty (rpc-pipeline+listing 5,25,45; allday-ingest 10,30,50;
# pinnacle-owner 6,26,46; ops-monitor 13,43).
#
# 🚨 CORRECTED 2026-08-27 — this block used to claim "Twice hourly (30-min max
# gap) stays well under the watchlist max_silent (allday 90m / topshot 180m)
# even if GitHub drops a scheduled run." THAT GUARANTEE IS MEASURED FALSE, and
# it was load-bearing: it is why nobody treated this backstop as fragile.
#
# GitHub deprioritises `schedule` events under load and drops most of them. The
# rate is directly measurable on ufc-sales-indexer, which is the ONLY one of the
# four whose cron-job.org primary is dead — so it is the one pipeline whose
# cadence reflects THIS WORKFLOW ALONE. Measured over 24h on 2026-08-27:
#
#     pipeline                  runs/24h   avg gap   max gap
#     topshot-sales-indexer          85     16.9m     40.0m   <- cron-job.org alive
#     allday-sales-indexer           85     16.9m     40.0m   <- cron-job.org alive
#     golazos-sales-indexer          87     16.5m     39.0m   <- cron-job.org alive
#     ufc-sales-indexer              16     76.9m    191.9m   <- THIS WORKFLOW ONLY
#
# 16 of 48 scheduled runs delivered. The old comment budgeted for ONE dropped
# run; the real rate is two in three. **A 191.9m max gap BREACHES All Day's 90m
# max_silent**, so if cron-job.org ever dies for AllDay the way it has for UFC,
# this backstop does NOT hold the line its header promised.
#
# ⛔ Do not "fix" this by tightening the cron expression — GitHub drops the
# extra fires too, and a denser schedule on a deprioritised queue buys little.
# A real fix needs a caller GitHub does not throttle. Full measurement, controls
# and the UFC-specific finding: docs/overnight/inbox/2026-08-27T0250Z-ufc-sales-
# indexer-has-only-the-flaky-gha-backstop-left-and-the-backstop-delivers-a-third-
# of-its-schedule.md
#
# ⚠ These are DATED SAMPLES. GitHub's drop rate follows its own load — re-derive
# from pipeline_runs before quoting them.
#
# 2026-06-30 (handoff-2026-06-30-cron-to-gha-migration): extended to the two
# remaining watchlisted sales indexers, golazos-sales-indexer (cron-job.org
# 11,31,51) and ufc-sales-indexer (chained off /api/ufc-pipeline 18,38,58) —
# both MEDIUM severity, max_silent 90m, and both idempotent (transaction_hash
# dedup / onConflict ignoreDuplicates) + fire-and-forget after(), so a backstop
# tick at :18/:48 (30-min gap << 90m) is the same safe dual-trigger as TS/AllDay.
# cron-job.org stays primary for all four; no twin-disable required.
#
# OPERATOR end-state (optional, for a clean single trigger): once this backstop
# has a few clean ticks, disable the cron-job.org entries "RPC TopShot Sales
# Indexer" (/api/sales-indexer) and "RPC All Day Sales Indexer"
# (/api/allday-sales-indexer) and bump this schedule to their old cadence.
# Until then, dual-trigger is intentional and harmless.
on:
  schedule:
    - cron: "18,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-indexers:
    runs-on: ubuntu-latest
    # Sized from the steps: 3 x (--retry 3 --max-time 60 = 4 attempts + backoff)
    # is ~12.4 min worst case. At the old 5 the Golazos step could never fire
    # on a hung site.
    timeout-minutes: 14
    steps:
      # The composite below is local, so the tree must be checked out first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: TopShot Sales Indexer (on-chain) — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/sales-indexer
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: TopShot sales-indexer
          accept: "200,202"
          retries: "3"
          max-time: "60"
          fail-on-auth: "false"
      - name: AllDay Sales Indexer (on-chain) — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/allday-sales-indexer
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: AllDay sales-indexer
          accept: "200,202"
          retries: "3"
          max-time: "60"
          fail-on-auth: "false"
      - name: Golazos Sales Indexer (on-chain) — backstop trigger
        continue-on-error: true
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/golazos-sales-indexer
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: Golazos sales-indexer
          accept: "200,202"
          retries: "3"
          max-time: "60"
          fail-on-auth: "false"
      # ⛔ UFC Sales Indexer step REMOVED 2026-08-27, on Trevor's call: "once we've
      # ingested all existing UFC Strike history, we don't need to keep searching
      # and trying to look for more. If they decide to come back, we can start
      # monitoring it more actively again."
      #
      # The precondition was MEASURED, not assumed:
      #   * `ufc-sales-indexer`         672 runs / 30d, rows_written **0**, rows_found **0**
      #   * `ufc-sales-history-backfill` 222 runs / 30d, rows_written **0** (found 57, all already held)
      #   * newest ufc_strike sale **2026-05-13**; 0 sales in 30d AND 90d, of 813,934 total
      #   * coverage spans the full lifetime 2022-02-15 → 2026-05-13
      #   * `extra.v2_dapper_typeids_seen` has NEVER carried a UFC type id
      # UFC Strike left Flow for Aptos on 2026-05-13 — already recorded in this
      # repo's own watchlist notes, and `ufc-listings-indexer` was retired the same
      # way on 2026-07-11. This is the sales leg following its own sibling.
      #
      # ⚠ The three UFC pipelines that DO work were left running, because a blanket
      # "retire UFC" would have broken them: `ufc-enrichment-drain` wrote **39,934
      # rows in 30 days**, plus `ufc-stub-thumbnail-resolver` and `wallet-backfill-ufc`.
      # Retire by MEASURED YIELD, never by collection name.
      #
      # ⚠ This workflow was ALSO the last live trigger for that route — cron-job.org's
      # /api/ufc-pipeline entry is already dead (measured 2026-08-27: 16 runs/24h here
      # vs 85-87 for the three live siblings, timestamps matching these GHA runs
      # exactly). So removing this step stops the route entirely; nothing else calls it.
      #
      # REVERT (all four parts): re-add this step; re-add the two `/api/cron/ufc-*`
      # entries to vercel.json; and
      #   UPDATE public.pipeline_cadence_watchlist SET is_active = true
      #    WHERE pipeline IN ('ufc-sales-indexer','ufc-sales-history-backfill',
      #                       'ufc-studio-sales-history-backfill');
      # The routes, the 813,934 sales and every UFC surface are untouched.
