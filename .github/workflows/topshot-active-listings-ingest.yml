name: TopShot Active Listings Ingest — underpriced #1s deal board

# Per-serial TS ask feed for the Underpriced #1s deal board. Runs on a GitHub
# Actions runner (NOT cron-job.org / NOT a Vercel route) because the public
# Dapper Atlas API 403-blocks Node/undici fetch + Vercel egress but allows curl.
# The runner curls Atlas for each candidate's #1/perfect serial and POSTs the
# rows to /api/cron/topshot-active-listings-ingest (Bearer INGEST_SECRET_TOKEN),
# which does all DB I/O via the service role. Kill switch: disable this workflow.
#
# Verdict + design: docs/overnight/ledger.md (2026-06-16 underpriced-serials).

on:
  schedule:
    # Every 3h at :29 (off-anchor). A full $100-floor sweep is ~1,080 targets x
    # 2 gentle Atlas calls ~= 15-18 min; Atlas soft-throttles bursts, so cadence
    # stays gentle. Asks on these scarce serials don't move minute-to-minute.
    #
    # Moved :13 -> :29 on 2026-07-26. Minute :13 is the second-heaviest minute
    # across all four schedulers (9 jobs: ops-monitor.yml hourly 13,43, the TS
    # sales indexer's 3,23,43 neighbour set, hybrid-custody-events, seed-wallet
    # cohort 2, seed-topshot-pack-distributions, EF ts-pack-ev, ...), so this
    # 15-18 min Atlas sweep was starting inside the fullest window of the hour.
    # :29 carries only alerts-dispatch. Nothing downstream depends on the
    # minute -- the runner curls Atlas and POSTs to a Bearer-auth route.
    - cron: "29 */3 * * *"
  workflow_dispatch:
    inputs:
      floor:
        description: "min #1 estimate $ to be a target (default 100)"
        type: string
        default: "100"
      max_targets:
        description: "cap targets processed (blank = all; use a small N to smoke test)"
        type: string
        default: ""
      dry_run:
        description: "fetch Atlas + report, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 2026-08-30. This workflow had failed 12/12 scheduled runs: Dapper Atlas WAF-blocks
  # the GitHub-runner IP, so every tick burned ~90s, wrote an `egress_blocked`
  # pipeline_runs row, and left a permanently-red badge -- which by our own rule is
  # indistinguishable from a broken instrument at a glance, so a NEW failure here
  # could not have been seen.
  #
  # The board is NOT starved: it is fed by the residential Windows Task Scheduler arm
  # on Trevor's box (18/18 = 100% over 7d, 26,584 Atlas calls). This GHA arm has
  # contributed 0 rows and 0 Atlas calls in that window, so gating it removes no
  # redundancy -- it was never redundant.
  #
  # NOTE the polarity is the OPPOSITE of badge-sync.yml's probe. There the HOST was
  # down and a runner-IP 403 had to count as alive. Here the host is fine and the
  # RUNNER is blocked, so a 403 challenge means "this runner cannot do the job" and
  # must skip. Self-resuming either way: if GitHub's egress is ever unblocked, the
  # probe passes and the backstop silently comes back with no one to remember it.
  #
  # THREE probes, not one: Atlas's challenge is PROBABILISTIC (measured 2026-08-30
  # from a working egress: 10% overall, 23% in the worst batch, scattered rather than
  # tail-clustered). A single probe would misclassify a working runner ~1 tick in 10.
  # Requiring >=1 usable 200 of 3 keeps a fully-blocked IP at 0 while making a false
  # skip on a working IP ~1 in 1000.
  atlas-reachable:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    steps:
      - id: probe
        run: |
          OK=0
          for i in 1 2 3; do
            # bash -e: a fallible command in an ASSIGNMENT aborts the step, so the
            # `|| STATUS=` fallback is load-bearing, not decorative.
            STATUS=$(curl -s -o /tmp/atlas-probe.json -w "%{http_code}" --max-time 20 -X POST               -H "connect-protocol-version: 1"               -H "content-type: application/json"               -H "Origin: https://dapper.market"               -H "Referer: https://dapper.market/"               -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"               --data '{"product":"nba","completed":false,"editionId":"2402","sortByOption":"SERIAL_NUMBER","sortByDirection":"ASC","limit":"1","offset":"0","offers":false}'               https://api.production.atlas.dapperlabs.com/public/atlas.v1.MarketplaceService/SearchMarketplaceTransactions) || STATUS="000"
            echo "atlas probe $i/3 -> $STATUS"
            if [ "$STATUS" = "200" ]; then OK=$((OK+1)); fi
            sleep 3
          done
          # Assert the count the guard actually inspected, so a probe loop that
          # silently ran zero times cannot read as a clean skip.
          echo "usable 200s: $OK of 3 probes"
          if [ "$OK" -ge 1 ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Atlas is unreachable from this runner (0 of 3 probes returned 200) -- skipping. The residential Task Scheduler arm feeds the board; this job is only a backstop."
          fi

  ingest:
    needs: atlas-reachable
    if: needs.atlas-reachable.outputs.reachable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Ingest active listings
        env:
          INGEST_SECRET_TOKEN: ${{ secrets.INGEST_SECRET_TOKEN }}
          FLOOR: ${{ github.event.inputs.floor }}
          MAX_TARGETS: ${{ github.event.inputs.max_targets }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/ingest-topshot-active-listings.mjs
