name: Cloudflare workers deploy (from the committed files)

# 2026-10-25. Deploys Cloudflare workers from the files committed on the ref
# this workflow runs on, by running scripts/deploy-workers.mjs (`npx wrangler
# deploy` in each workers/<name>/, one at a time, stopping at the first
# failure). Until now every worker deploy needed `npx wrangler login` on
# Trevor's machine, because no Cloudflare credential existed anywhere else, so
# the R138 security fixes (2026-10-25 audit) sat written, tested and pushed but
# undeployed. With the two repo secrets below set, any session can dispatch
# this instead.
#
# Credentials (repo secrets, Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   required — a Cloudflare API token made from the
#                          "Edit Cloudflare Workers" template, scoped to the
#                          RPC account. wrangler reads it from the environment.
#   CLOUDFLARE_ACCOUNT_ID  optional — only needed if the token can see more
#                          than one account.
# `wrangler deploy` keeps each worker's existing secrets and vars; it ships
# code and wrangler.toml config only. It ships EVERYTHING in workers/<name>/
# at this ref, not only the latest change — check `git log -- workers/<name>`.
#
# Triggers:
#   push to main touching workers/**  (2026-10-26) — deploys ONLY the workers whose
#     directory changed since the LAST SUCCESSFUL push run of this workflow (2026-10-27;
#     was "since this push's `before`"). ⚠ Why: the concurrency group below keeps ONE
#     pending run — a newer push CANCELS the older pending one, so a run that diffed only
#     its own push would silently drop the cancelled push's workers. Diffing from the last
#     success also re-tries workers whose deploy failed. Until CLOUDFLARE_API_TOKEN exists
#     it SKIPS with a notice instead of failing, so main never goes red over a missing
#     secret; on a manual dispatch a missing token is still an error.
#     ⚠ A skipped run still concludes "success" and moves that base: after first adding
#     the token, dispatch once with an empty worker list (deploys every worker).
#   workflow_dispatch — any worker list, or all of them.

on:
  push:
    branches: [main]
    paths: ['workers/**']
  workflow_dispatch:
    inputs:
      workers:
        description: "Space-separated worker names (directories under workers/). Empty = every worker with a wrangler.toml."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read   # list this workflow's own runs (the diff base for a push)

concurrency:
  group: workers-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS: ${{ inputs.workers }}
      EVENT: ${{ github.event_name }}
      BEFORE: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Pre-flight
        id: pre
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::notice::CLOUDFLARE_API_TOKEN is not configured — push deploy skipped (deploy from the laptop: node scripts/deploy-workers.mjs)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::CLOUDFLARE_API_TOKEN is not configured — nothing deployed."
            exit 2
          fi
          if [ "$EVENT" = "push" ]; then
            # The workers whose directory changed since the last SUCCESSFUL push run (see the
            # header: a cancelled pending run's push must not be dropped), else since this
            # push's `before`. An unfetchable base deploys every worker (below).
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow workers-deploy.yml --branch main \
                     --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null || true)
            if [ -z "$base" ]; then base="${BEFORE:-}"; fi
            changed=""
            if [ -n "$base" ] && ! printf '%s' "$base" | grep -Eq '^0+$' \
               && git fetch --no-tags --depth=1 origin "$base" >/dev/null 2>&1; then
              echo "diff base: $base"
              changed=$(git diff --name-only "$base" HEAD -- workers)
            else
              echo "::warning::No fetchable diff base — deploying EVERY worker (the tip's own changes cannot be read on a depth-1 checkout)."
              # On this depth-1 checkout HEAD has no parent: diff-tree prints NOTHING for it
              # without --root (every worker silently skipped — the old fallback), and with
              # --root it lists the whole tree. Over-deploying is the safe side of that choice.
              changed=$(git diff-tree --root --no-commit-id --name-only -r HEAD -- workers)
            fi
            WORKERS=""
            for d in $(printf '%s\n' "$changed" | awk -F/ 'NF>=3 {print $2}' | sort -u); do
              if [ -f "workers/$d/wrangler.toml" ]; then WORKERS="$WORKERS $d"; fi
            done
            WORKERS="${WORKERS# }"
            if [ -z "$WORKERS" ]; then
              echo "::notice::No deployable worker changed in this push."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push deploy: $WORKERS"
          fi
          echo "workers=$WORKERS" >> "$GITHUB_OUTPUT"
          for w in $WORKERS; do
            if ! printf '%s' "$w" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || [ ! -f "workers/$w/wrangler.toml" ]; then
              echo "::error::'$w' is not a worker (no workers/$w/wrangler.toml on this ref)."
              exit 2
            fi
          done
          echo "ref: $(git rev-parse --short HEAD)"

      - name: Deploy
        if: steps.pre.outputs.skip != 'true'
        env:
          WORKERS: ${{ steps.pre.outputs.workers }}
        run: |
          set -euo pipefail
          # Word-splitting on purpose: WORKERS is a validated space-separated list.
          # shellcheck disable=SC2086
          node scripts/deploy-workers.mjs $WORKERS
