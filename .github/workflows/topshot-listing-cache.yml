name: Top Shot Listing Cache
# Decoupled from "RPC Data Pipeline" (rpc-pipeline.yml) on 2026-06-25.
# Inside that monolith the listing-cache was step #5 of 7; when the earlier
# heavy steps (ingest / FMV recalc / backfill) ate the 18-min job budget the
# job was cancelled before step #5 ever ran, leaving the cache ~12h stale.
# The route is fire-and-forget (returns 202, work runs in after()), so it
# does not need the pipeline's runtime budget — give it its own tiny job.
#
# Schedule moved 5,25,45 -> 15,35,55 on 2026-07-26. Two reasons, both real:
#   1. Collision. 5,25,45 was fired simultaneously by rpc-pipeline.yml (GHA),
#      this workflow (GHA), AND "RPC Pinnacle Listings Indexer" (cron-job.org)
#      = 72 three-way firings/day into an IOPS-constrained DB, plus a 4-way
#      four times a day when badge-sync.yml's catalog sweep lands on :45.
#      That contradicts the deliberate 2026-06-07 anti-pile-up stagger
#      (docs/operations/cron-schedule.md), which flagged this file with
#      "same minutes as rpc-pipeline" and never got the follow-up move.
#   2. Backstop value. ⚠ THIS PREMISE WAS ALREADY FALSE WHEN WRITTEN (see the
#      2026-09-02 correction below). rpc-pipeline.yml ALREADY calls this same route as its
#      step #5, so on 5,25,45 the two triggers were redundant *in the same
#      minute* — which defeats the entire point of the 2026-06-25 split. At
#      +10 minutes this workflow becomes a genuine temporal fallback: when the
#      monolith's earlier heavy steps eat the job budget and cancel step #5,
#      the cache is still refreshed 10 minutes later.
# 15,35,55 is the lightest legal trio on the cross-scheduler load map
# (cron-job.org + edge fns + workers + GHA); minutes 0/1/20/21/40/41 are the
# banned "rush class" per that doc's scheduling rules.
#
# ⚠ SCHEDULE MOVED TO VERCEL CRON on 2026-08-01 — this workflow is now
# MANUAL-ONLY (workflow_dispatch). GitHub Actions was silently dropping ~83% of
# the ticks: measured from the GHA run history itself (not the DB, so this is not
# an after()/logging artifact), it fired only 10-13 runs/day against the 72/day
# this 15,35,55 schedule implies, every day 07-27..08-01. Vercel crons on the same
# project deliver ~100% over the same window (candy-listings-indexer 8/8,
# allday-price-recover 80/72), so the identical minutes now live in vercel.json.
# The minutes were kept EXACTLY as 15,35,55 so the deliberate anti-pile-up stagger
# documented below and in docs/operations/cron-schedule.md is unchanged — only the
# scheduler swapped. The route learned to accept CRON_SECRET (Vercel cron cannot
# send INGEST_SECRET_TOKEN) in the same commit.
# ⛔ CORRECTION 2026-09-02: rpc-pipeline.yml does NOT call this route. Its own
# header records the listing-cache step was REMOVED on 2026-06-25, and its six
# steps (pinned by EXPECTED_STEPS: "6" and __tests__/rpc-pipeline-workflow-can-
# fail.test.ts) contain no listing-cache call. So /api/topshot-listing-cache has
# exactly ONE trigger, the Vercel cron at 15,35,55, and no temporal backstop —
# the previous sentence here claimed one that did not exist. The feed behind
# cached_listings -> badge_editions.low_ask -> ASK-derived FMV is single-trigger;
# if a backstop is wanted, add the route as a seventh rpc-pipeline step and bump
# EXPECTED_STEPS with it. Keep this dispatch trigger for manual refreshes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The composite below is local, so the tree must be checked out first.
      - uses: actions/checkout@v4
      - name: Top Shot Listing Cache — Refresh via flowty-proxy edge fn (background)
        uses: ./.github/actions/rpc-call
        with:
          url: https://www.rippackscity.com/api/topshot-listing-cache
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: TopShot listing cache
          method: GET
          accept: "200,202"
          retries: "3"
          fail-on-auth: "false"
