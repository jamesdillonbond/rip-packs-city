name: RPC Data Pipeline
on:
  schedule:
    - cron: "5,25,45 * * * *"
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Ingest — Fetch latest Top Shot sales
        run: |
          STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/ingest.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            https://www.rippackscity.com/api/ingest)
          echo "Ingest status: $STATUS"
          cat /tmp/ingest.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Ingest returned $STATUS"
          fi
      - name: FMV Recalc — Recompute fair market values
        run: |
          STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/recalc.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            https://www.rippackscity.com/api/fmv-recalc)
          echo "FMV recalc status: $STATUS"
          cat /tmp/recalc.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::FMV recalc returned $STATUS"
          fi
      - name: FMV Backfill — Cover editions with sales but no FMV snapshot
        run: |
          STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/fmv-backfill.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"batchSize":100}' \
            https://www.rippackscity.com/api/fmv-backfill)
          echo "FMV backfill status: $STATUS"
          cat /tmp/fmv-backfill.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::FMV backfill returned $STATUS"
          fi
      - name: Backfill Player Names — Fill missing player names via Supabase Edge Function
        continue-on-error: true
        run: |
          STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/player-names.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            https://www.rippackscity.com/api/backfill-player-names)
          echo "Player names backfill status: $STATUS"
          cat /tmp/player-names.json
      - name: Top Shot Listing Cache — Refresh via flowty-proxy edge fn (background)
        continue-on-error: true
        run: |
          STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/ts-cache.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            https://www.rippackscity.com/api/topshot-listing-cache)
          echo "TopShot listing cache status: $STATUS"
          cat /tmp/ts-cache.json
      - name: Backfill — Ingest historical sales
        run: |
          STATUS=$(curl -s --retry 3 --retry-all-errors -o /tmp/backfill.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            https://www.rippackscity.com/api/backfill)
          echo "Backfill status: $STATUS"
          cat /tmp/backfill.json
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backfill returned $STATUS"
          fi
      - name: Price snapshots
        run: |
          RESPONSE=$(curl -s --retry 3 --retry-all-errors -X POST https://www.rippackscity.com/api/cron/price-snapshots \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "Price snapshots: $RESPONSE"
