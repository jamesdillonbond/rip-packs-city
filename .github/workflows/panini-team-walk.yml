name: Panini team walk — NBA/MLB listings for franchise hubs (staging)

# Walks Panini's marketplace grid FILTERED BY TEAM in headless Chromium and writes
# the listings into public.panini_team_listings via panini_team_listings_ingest.
# Staging only — nothing on the site reads it until Panini NBA/MLB clears the
# accuracy gate. Design, measurements and the pilot scope:
# docs/features/franchise-hubs.md.
#
# Pilot targets (2026-09-24): the two franchises the hubs were built around —
# Portland Trail Blazers (~150–250 grid pages) and Detroit (MLB cards carry the
# city only; Detroit is one club). Measured from a datacenter IP on 2026-09-24:
# Detroit walked 35 pages / 1,020 listings in ~3 min, ending on an empty page.
#
# The job fails (red) when a walk ends INCOMPLETE or a write does not land —
# the script derives `ok` from both, and logs panini-team-walk rows to
# pipeline_runs (plus a heartbeat before each target).

on:
  schedule:
    - cron: "37 10 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Sport:Team;Sport:Team  (Basketball | Baseball; MLB uses the city)'
        type: string
        default: "Basketball:Portland Trail Blazers;Baseball:Detroit"
      max_pages:
        description: "page cap per target"
        type: string
        default: "400"
      dry_run:
        description: "walk and report, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: panini-team-walk
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Walk
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PANINI_TEAM_TARGETS: ${{ github.event.inputs.targets || 'Basketball:Portland Trail Blazers;Baseball:Detroit' }}
          PANINI_MAX_PAGES: ${{ github.event.inputs.max_pages || '400' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/panini-team-walk.mjs
