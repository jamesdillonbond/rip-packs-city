name: Top Collector census (Dune)

# The full holder census behind the Top Collector Leaderboard (2026-11-27): one call per collection to
# /api/cron/top-collector-census-dune, which uploads RPC's edition map to Dune, runs the saved census query,
# and swaps the ranking in (lib/dune/top-collector-census.ts, docs/features/top-fans.md).
#
# Weekly tick, but AT MOST ONE SUCCESSFUL CENSUS PER COLLECTION PER DUNE BILLING CYCLE (2026-11-27): the route
# skips a collection whose census already landed since the cycle started (dune_budget_status.cycle_start), so
# the Mondays after a success cost nothing and a failed run is retried the next Monday. A census is a
# full-history scan of flow.cadence_events per collection, billed in Dune credits (calibration: ~80 credits per
# full-history TopShot.Deposit scan, ~2 credits per 1,000 result rows) out of the Analyst plan's 4,000 a cycle.
# The route also stops at the shared spend gate (dune_budget_state.paused, its dune_budget_allocation row
# 'top-collector-census-dune' enabled=false, or credits spent) and logs that as a configured stop. The lane is
# DISABLED until a controlled first run (Golazos first, cost read back) — see docs/features/top-fans.md.
# workflow_dispatch runs one collection on demand (?force=1 is not offered: re-buying a census is a decision).
# Each call returns 202 and does its work in the route's after(); the run's outcome is the
# `top-collector-census-dune` row in pipeline_runs, not this job's status.

on:
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:
    inputs:
      collection:
        description: "nba-top-shot | nfl-all-day | laliga-golazos | disney-pinnacle | all"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: top-collector-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        collection: [nba-top-shot, nfl-all-day, laliga-golazos, disney-pinnacle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Census — ${{ matrix.collection }}
        if: ${{ (github.event.inputs.collection || 'all') == 'all' || github.event.inputs.collection == matrix.collection }}
        uses: ./.github/actions/rpc-call
        with:
          url: "https://www.rippackscity.com/api/cron/top-collector-census-dune?collection=${{ matrix.collection }}"
          token: ${{ secrets.INGEST_SECRET_TOKEN }}
          label: Top Collector census ${{ matrix.collection }}
          method: POST
          accept: "202"
          max-time: "60"
