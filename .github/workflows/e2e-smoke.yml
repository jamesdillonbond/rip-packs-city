name: E2E DOM Smoke

# Rendered-DOM smoke over the PUBLIC deployed surfaces (e2e/smoke.spec.ts) plus
# the entity/detail pages discovered live from the sitemap (e2e/entity-smoke.spec.ts)
# and the mobile LAYOUT monitor (e2e/mobile-layout.spec.ts) — measured boxes at a
# phone viewport, the class where WalletSearchBand rendered 350px tall against
# the ~100px it specified for four weeks with every other gate green, because
# jsdom returns a zero box and coverage sees whether a line RAN, not what it
# measured. Its assertions are bans at population zero as of 2026-08-22.
# This is a MONITOR, not a pull_request gate: it drives a real browser against
# the live site and asserts each public page renders actual content (not just an
# HTTP 200 streaming shell) with no error boundary — the "200-but-broken-DOM"
# class the API smoke gate (smoke-tests.yml) structurally cannot see.
#
# Runs on a schedule + manual dispatch only, so a live-site hiccup never blocks a
# merge. Point it at a preview by dispatching with a different SMOKE_BASE_URL.
on:
  schedule:
    - cron: '41 */6 * * *' # every 6h, off the top of the hour
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to smoke (defaults to production)'
        required: false
        default: 'https://www.rippackscity.com'

permissions:
  contents: read

jobs:
  dom-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Browser binaries cached across runs (keyed on the lockfile, so a Playwright
      # bump re-downloads). `install --with-deps` still installs the OS packages
      # each run; only the ~150 MB Chromium download is skipped on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run DOM smoke
        env:
          # workflow_dispatch input wins; otherwise production.
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.rippackscity.com' }}
        run: npx playwright test smoke.spec.ts entity-smoke.spec.ts smoke-selfcheck.spec.ts mobile-layout.spec.ts hydration-clock.spec.ts
      # ⚠ Until 2026-08-29 this uploaded nothing. playwright.config.ts declared
      # only the list + json reporters, so `playwright-report/` was never
      # written and every failing run logged `No files were found with the
      # provided path`. Eight of the previous thirty runs failed — including a
      # REAL React #418 on /insights/underpriced-serials (run 111) that survived
      # two retries — and not one kept a byte of evidence. The html reporter is
      # now declared; `test-results/` carries the traces the report links to and
      # e2e-results.json is the machine-readable summary. `if-no-files-found:
      # error` so this can never silently regress to uploading nothing again.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          if-no-files-found: error
          retention-days: 7
