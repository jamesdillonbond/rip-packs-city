name: E2E DOM Smoke

# Rendered-DOM smoke over the PUBLIC deployed surfaces (e2e/smoke.spec.ts) plus
# the entity/detail pages discovered live from the sitemap (e2e/entity-smoke.spec.ts)
# and the mobile LAYOUT monitor (e2e/mobile-layout.spec.ts) — measured boxes at a
# phone viewport, the class where WalletSearchBand rendered 350px tall against
# the ~100px it specified for four weeks with every other gate green, because
# jsdom returns a zero box and coverage sees whether a line RAN, not what it
# measured. Its assertions are bans at population zero as of 2026-08-22.
# This is a MONITOR, not a pull_request gate: it drives a real browser against
# the live site and asserts each public page renders actual content (not just an
# HTTP 200 streaming shell) with no error boundary — the "200-but-broken-DOM"
# class the API smoke gate (smoke-tests.yml) structurally cannot see.
#
# Runs on a schedule, on manual dispatch, and (since 2026-09-25) after every
# successful PRODUCTION deploy — never as a merge gate, so a live-site hiccup
# never blocks a push. Point it at a preview by dispatching with a different
# SMOKE_BASE_URL.
#
# ⚠ WHY ON DEPLOY. On the 6h schedule alone, a deploy that breaks a page was
# first seen up to 6h later (the 09-20 Pinnacle 500 was found by real traffic).
# Vercel reports each deploy to GitHub as a deployment; `deployment_status`
# fires for every state, and the job's `if:` keeps only Production + success.
# Every other status still creates a SKIPPED run — expected, not a fault.
# ⚠ scheduler-liveness counts this workflow's runs with `event=schedule` only,
# so deploy runs cannot inflate its 4/day no-change control.
# ⚠ ~47 production deploys/day (measured 2026-09-25): the concurrency group
# below cancels an in-flight deploy smoke when a newer deploy lands, so a burst
# of pushes smokes only the build that is actually live.
on:
  deployment_status:
  schedule:
    - cron: '51 */6 * * *' # every 6h, off the top of the hour; :51 is free — :41 collided with ops-monitor's 06:41 data-integrity lambda (2026-09-04)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to smoke (defaults to production)'
        required: false
        default: 'https://www.rippackscity.com'

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'deployment_status' }}

jobs:
  dom-smoke:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Browser binaries cached across runs (keyed on the lockfile, so a Playwright
      # bump re-downloads). `install --with-deps` still installs the OS packages
      # each run; only the ~150 MB Chromium download is skipped on a hit.
      # Split restore/save (2026-09-25): GitHub refuses a cache SAVE on a
      # `deployment_status` run ("not tied to a branch or tag ref"), which the
      # combined action surfaced as a warning on every deploy smoke. Every run
      # restores; only scheduled/dispatched runs save, and only on a miss.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Save Playwright browsers
        if: github.event_name != 'deployment_status' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run DOM smoke
        env:
          # workflow_dispatch input wins; otherwise production.
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.rippackscity.com' }}
        run: npx playwright test smoke.spec.ts entity-smoke.spec.ts smoke-selfcheck.spec.ts mobile-layout.spec.ts hydration-clock.spec.ts
      # ⚠ Until 2026-08-29 this uploaded nothing. playwright.config.ts declared
      # only the list + json reporters, so `playwright-report/` was never
      # written and every failing run logged `No files were found with the
      # provided path`. Eight of the previous thirty runs failed — including a
      # REAL React #418 on /insights/underpriced-serials (run 111) that survived
      # two retries — and not one kept a byte of evidence. The html reporter is
      # now declared; `test-results/` carries the traces the report links to and
      # e2e-results.json is the machine-readable summary. `if-no-files-found:
      # error` so this can never silently regress to uploading nothing again.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-results.json
          if-no-files-found: error
          retention-days: 7
