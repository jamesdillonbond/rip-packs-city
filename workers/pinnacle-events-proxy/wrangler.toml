name = "pinnacle-events-proxy"
main = "index.ts"
compatibility_date = "2024-10-01"

# No routes — this worker is invoked manually via its *.workers.dev URL
# from Vercel cron routes. No custom domain binding.

[vars]
# INGEST_SECRET_TOKEN is set via:
#   wrangler secret put INGEST_SECRET_TOKEN
# Shared secret with the Vercel cron caller (/api/cron/pinnacle-events-ingest).
