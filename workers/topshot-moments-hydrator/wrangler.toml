name = "topshot-moments-hydrator"
main = "index.ts"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

# workers_dev = true is REQUIRED. Omitting it means the *.workers.dev
# subdomain is unrouted at the Cloudflare edge and every request 404s
# silently with no log entry. Lesson re-learned from pinnacle-events-proxy.
workers_dev = true

# Service binding to topshot-proxy. Worker-to-worker fetch over the public
# *.workers.dev URL on the same Cloudflare account hits error 1042 (verified
# in production via 404+1042). Service bindings route the request internally
# and bypass the edge entirely. The bound worker's `service` value must match
# the `name` field in workers/topshot-proxy/wrangler.toml.
[[services]]
binding = "TOPSHOT_PROXY"
service = "topshot-proxy"

# ⚠ THE CRON WAS DASHBOARD-SET AND DECLARED NOWHERE (known-issues #21, found
# 2026-08-22, re-verified 08-24, codified 2026-09-03). `wrangler deploy` reconciles
# cron triggers FROM THIS FILE, so deploying the worker without this block would
# silently DELETE the schedule and kill the pipeline — the 2026-08-21 "two configs,
# one worker" family. The minute pattern is the MEASURED one: every observed
# `started_at` in pipeline_runs sits at minute ≡ 2 (mod 10). If the dashboard shows
# a different expression, the dashboard is the truth — make THIS file match it
# before the next deploy, never the other way round.
[triggers]
crons = ["2-52/10 * * * *"]

# Secrets (write-only after creation):
#   wrangler secret put INGEST_SECRET_TOKEN        --name topshot-moments-hydrator
#   wrangler secret put SUPABASE_URL                --name topshot-moments-hydrator
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY   --name topshot-moments-hydrator
#   wrangler secret put TS_PROXY_SECRET             --name topshot-moments-hydrator
#
# TS_PROXY_SECRET must match the topshot-proxy worker's PROXY_SECRET — the
# proxy still validates the X-Proxy-Secret header on service-binding calls
# (same TS_PROXY_SECRET rotation surface — see CLAUDE.md "Worker auth surfaces").
# TS_PROXY_URL is no longer used (replaced by the service binding above) but
# leaving the secret in place is harmless.
