name = "atlas-proxy"
main = "index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
# PROXY_SECRET is set via: wrangler secret put PROXY_SECRET
# Reuse the TS_PROXY_SECRET value the other Dapper proxies use, or mint a
# dedicated secret — either works, the script sends whatever you configure as
# ATLAS_PROXY_SECRET (falls back to TS_PROXY_SECRET).
